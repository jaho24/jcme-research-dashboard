<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>竞争分析 - 京城机电产业研究与市场分析平台</title>
<link rel="stylesheet" href="../assets/subpage-layout.css">
<link rel="stylesheet" href="../assets/subpage-nav.css">
<link rel="stylesheet" href="../assets/compete-page.css">
</head>
<body>
<header class="platform-nav-outer">
  <div class="platform-nav-inner">
    <div id="platform-nav-mount" data-active="compete"></div>
  </div>
</header>
<div class="compete-page">

  <div class="compete-toolbar">
    <div class="toolbar-industry">
      <span class="toolbar-companies-label">行业赛道</span>
      <div class="industry-tabs" id="industry-tabs" role="tablist" aria-label="竞争分析行业">
        <button type="button" class="industry-tab active" data-industry="robot" role="tab" aria-selected="true">工业机器人</button>
        <button type="button" class="industry-tab" data-industry="machine" role="tab" aria-selected="false">机床</button>
      </div>
    </div>
    <div class="toolbar-search">
      <select id="search-scope" aria-label="搜索范围">
        <option value="all">全部</option>
        <option value="company">企业名称</option>
        <option value="product">产品</option>
        <option value="industry">行业</option>
      </select>
      <input type="search" id="search-input" placeholder="在筛选结果中搜索公司或产品…" aria-label="搜索关键词">
      <button type="button" id="search-btn">开始搜索</button>
    </div>
    <div class="toolbar-companies">
      <span class="toolbar-companies-label">企业选择</span>
      <div id="company-list"></div>
    </div>
  </div>

  <main class="compete-main">
    <h1 class="company-title" id="company-title"></h1>
    <div class="compete-body">
      <nav class="content-sidebar" id="content-sidebar" aria-label="内容目录"></nav>
      <div class="content-panel" id="tab-panel" aria-live="polite"></div>
    </div>
  </main>

  <footer class="compete-footer" id="compete-footer">数据来源：MOSS企业360透视 · 竞对企业分析（不含本方）</footer>
</div>

<script src="../assets/subpage-nav.js"></script>
<script src="../assets/compete-profile-data.js"></script>
<script src="../assets/compete-industry-data.js"></script>
<script src="../assets/compete-analysis-detail.js"></script>
<script>
(function(){
  var PROFILE_DATA = window.COMPETE_PROFILES || { companies: [] };
  var INDUSTRY_DATA = window.COMPETE_BY_INDUSTRY || {};
  var ANALYSIS_DATA = window.COMPETE_ANALYSIS || {};
  var ROBOT_PROFILES = window.COMPETE_ROBOT_PROFILES || {};
  var DEMO_FINANCE = window.COMPETE_DEMO_FINANCE || {};
  var DEMO_MONITOR = window.COMPETE_DEMO_MONITOR || {};
  var DEMO_FACTORIES = window.COMPETE_DEMO_FACTORIES || {};

  var TABS = [
    { id: 'basic', label: '基本情况' },
    { id: 'finance', label: '财务信息' },
    { id: 'monitor', label: '业务监测' },
    { id: 'factories', label: '工厂分布' }
  ];

  var companies = [];
  var state = { industry: 'robot', company: '', tab: 'basic', monitorSub: 'annual' };

  var companyListEl = document.getElementById('company-list');
  var companyTitleEl = document.getElementById('company-title');
  var contentSidebarEl = document.getElementById('content-sidebar');
  var tabPanelEl = document.getElementById('tab-panel');
  var footerEl = document.getElementById('compete-footer');
  var industryTabsEl = document.getElementById('industry-tabs');

  function esc(s){
    if(s == null) return '—';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function getProfileById(id){
    var list = PROFILE_DATA.companies || [];
    for(var i = 0; i < list.length; i++){
      if(list[i].id === id) return list[i];
    }
    return null;
  }

  function buildCompanies(industry){
    var block = INDUSTRY_DATA[industry];
    if(!block || !block.companies) return [];
    return block.companies.map(function(meta){
      var id = meta.id;
      var base = null;
      if(id.indexOf('robot-') === 0 && ROBOT_PROFILES[id]){
        base = Object.assign({}, ROBOT_PROFILES[id]);
      } else if(id.indexOf('comp-') === 0){
        base = getProfileById(id);
        if(base) base = Object.assign({}, base);
      }
      if(!base) return null;
      if(DEMO_FINANCE[id]){
        base.demoFinance = Object.assign({}, DEMO_FINANCE[id], base.demoFinance || {});
      }
      if(DEMO_MONITOR[id]){
        base.demoMonitor = Object.assign({}, DEMO_MONITOR[id], base.demoMonitor || {});
      }
      if(DEMO_FACTORIES[id]){
        base.demoFactories = Object.assign({}, DEMO_FACTORIES[id], base.demoFactories || {});
      }
      base.shortName = meta.name || base.shortName;
      base.analysis = ANALYSIS_DATA[id] || null;
      base.listMeta = meta;
      return base;
    }).filter(function(c){ return c && !c.isSelf; });
  }

  function getCompany(id){
    for(var i = 0; i < companies.length; i++){
      if(companies[i].id === id) return companies[i];
    }
    return companies[0] || null;
  }

  function field(label, value, isLink){
    var v = esc(value);
    if(isLink && value && value !== '—'){
      v = '<a href="' + esc(value) + '" target="_blank" rel="noopener">' + esc(value) + '</a>';
    }
    return '<div class="profile-field"><div class="label">' + esc(label) + '</div><div class="value">' + v + '</div></div>';
  }

  function renderAnalysis(c){
    var a = c.analysis;
    if(!a) return '';
    var tags = (a.tags || []).map(function(t){
      return '<span class="analysis-tag ' + esc(t.type || 'info') + '">' + esc(t.label) + '</span>';
    }).join('');
    var blocks = (a.sections || []).map(function(sec){
      var tone = sec.tone || 'info';
      var items = (sec.items || []).map(function(it){
        return '<li>' + esc(it) + '</li>';
      }).join('');
      return '<div class="analysis-block ' + tone + '">' +
        '<div class="analysis-block-title">' + esc(sec.title) + '</div>' +
        '<ul>' + items + '</ul></div>';
    }).join('');
    return '<div class="section-card analysis-card">' +
      '<div class="analysis-card-head">' +
      '<div class="analysis-card-title">360° 透视分析</div>' +
      '<span class="analysis-source">MOSS企业360透视</span></div>' +
      (a.summary ? '<p class="analysis-summary">' + esc(a.summary) + '</p>' : '') +
      (tags ? '<div class="analysis-tags">' + tags + '</div>' : '') +
      '<div class="analysis-grid">' + blocks + '</div></div>';
  }

  function renderBasic(c){
    var html = renderAnalysis(c);
    var p = c.profile || {};
    var left =
      field('公司全称', p.fullName) +
      field('法定代表人', p.legalPerson) +
      field('统一社会信用代码', p.creditCode) +
      field('工商注册号', p.regNo) +
      field('注册日期', p.regDate) +
      field('注册资本', p.regCapi) +
      field('企业性质', p.nature) +
      field('员工人数', p.employees) +
      field('企业状态', p.status);
    var right =
      field('所属行业', p.industry) +
      field('上市情况', p.listing) +
      field('国别', p.country) +
      field('省份', p.province) +
      field('城市', p.city) +
      field('品牌', p.brand) +
      field('公司官网', p.website, true) +
      field('集团归属', p.groupAffiliation) +
      field('荣誉资质', p.honors);

    var products = (c.mainProducts || []).map(function(pr){
      return '<li>' + esc(pr) + '</li>';
    }).join('');

    html += '<div class="section-card">' +
      '<div class="section-card-title">公司概况</div>' +
      '<div class="profile-grid">' + left + right + '</div></div>';
    if(c.mainBusiness){
      html += '<div class="section-card">' +
        '<div class="section-card-title">主营业务</div>' +
        '<p class="text-block">' + esc(c.mainBusiness) + '</p></div>';
    }
    if(products){
      html += '<div class="section-card">' +
        '<div class="section-card-title">主要产品</div>' +
        '<ul class="product-list">' + products + '</ul></div>';
    }
    return html;
  }

  function fmtNum(n){
    if(n == null || n === '—') return '—';
    return Number(n).toLocaleString('zh-CN');
  }

  function renderRevenueBarChart(chart){
    var years = chart.years, values = chart.values;
    var W = 480, H = 200, padL = 52, padR = 16, padT = 24, padB = 36;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var maxV = Math.max.apply(null, values) * 1.08 || 1;
    var barW = plotW / values.length * 0.55;
    var bars = values.map(function(v, i){
      var h = v / maxV * plotH;
      var x = padL + (i + 0.5) * (plotW / values.length) - barW / 2;
      var y = padT + plotH - h;
      return '<rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + h + '" fill="#1a3a78"/>';
    }).join('');
    var labels = years.map(function(y, i){
      var x = padL + (i + 0.5) * (plotW / years.length);
      return '<text x="' + x + '" y="' + (H - 8) + '" font-size="9" fill="#64748b" text-anchor="middle">' + y + '</text>';
    }).join('');
    var grid = '';
    for(var g = 0; g <= 4; g++){
      var gy = padT + plotH - (g / 4) * plotH;
      var gv = Math.round(maxV * g / 4);
      grid += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (padL + plotW) + '" y2="' + gy + '" stroke="#e2e8f0" stroke-dasharray="3,3"/>' +
        '<text x="' + (padL - 6) + '" y="' + (gy + 3) + '" font-size="8" fill="#94a3b8" text-anchor="end">' + gv.toLocaleString('zh-CN') + '</text>';
    }
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="营业收入趋势">' +
      grid +
      '<line x1="' + padL + '" y1="' + (padT + plotH) + '" x2="' + (padL + plotW) + '" y2="' + (padT + plotH) + '" stroke="#cbd5e1"/>' +
      bars + labels +
      '<text x="' + padL + '" y="14" font-size="9" fill="#64748b">营业收入总计(千元)</text></svg>';
  }

  function renderProfitDualChart(chart){
    var years = chart.years, profits = chart.netProfit, margins = chart.margin;
    var W = 480, H = 200, padL = 52, padR = 44, padT = 24, padB = 36;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var minP = Math.min.apply(null, profits), maxP = Math.max.apply(null, profits);
    var pRange = maxP - minP || 1;
    var minM = Math.min.apply(null, margins), maxM = Math.max.apply(null, margins);
    var mRange = maxM - minM || 1;
    var zeroY = padT + plotH - ((0 - minP) / pRange) * plotH;
    var barW = plotW / profits.length * 0.5;
    var bars = profits.map(function(v, i){
      var x = padL + (i + 0.5) * (plotW / profits.length) - barW / 2;
      var y, h, fill = v < 0 ? '#dc2626' : '#1a3a78';
      if(v >= 0){
        y = zeroY - (v / pRange) * plotH;
        h = (v / pRange) * plotH;
      } else {
        y = zeroY;
        h = (-v / pRange) * plotH;
      }
      return '<rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + Math.max(h, 1) + '" fill="' + fill + '"/>';
    }).join('');
    var linePts = margins.map(function(m, i){
      var x = padL + (i + 0.5) * (plotW / margins.length);
      var y = padT + plotH - ((m - minM) / mRange) * plotH;
      return x + ',' + y;
    }).join(' ');
    var dots = margins.map(function(m, i){
      var x = padL + (i + 0.5) * (plotW / margins.length);
      var y = padT + plotH - ((m - minM) / mRange) * plotH;
      return '<circle cx="' + x + '" cy="' + y + '" r="3.5" fill="#fff" stroke="#e91e8c" stroke-width="2"/>';
    }).join('');
    var yearLabels = years.map(function(y, i){
      if(i % 2 !== 0 && years.length > 8) return '';
      var x = padL + (i + 0.5) * (plotW / years.length);
      return '<text x="' + x + '" y="' + (H - 8) + '" font-size="9" fill="#64748b" text-anchor="middle">' + y + '</text>';
    }).join('');
    var mGrid = '';
    for(var g = 0; g <= 4; g++){
      var gy = padT + plotH - (g / 4) * plotH;
      var mv = minM + mRange * g / 4;
      mGrid += '<text x="' + (W - padR + 8) + '" y="' + (gy + 3) + '" font-size="8" fill="#e91e8c" text-anchor="start">' + mv.toFixed(0) + '%</text>';
    }
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="利润趋势与利润率">' +
      '<line x1="' + padL + '" y1="' + zeroY + '" x2="' + (padL + plotW) + '" y2="' + zeroY + '" stroke="#e2e8f0" stroke-dasharray="3,3"/>' +
      '<line x1="' + padL + '" y1="' + (padT + plotH) + '" x2="' + (padL + plotW) + '" y2="' + (padT + plotH) + '" stroke="#cbd5e1"/>' +
      bars +
      '<polyline points="' + linePts + '" fill="none" stroke="#e91e8c" stroke-width="2"/>' +
      dots + yearLabels + mGrid +
      '<text x="' + padL + '" y="14" font-size="9" fill="#64748b">净利润(千元)</text>' +
      '<text x="' + (W - padR) + '" y="14" font-size="9" fill="#e91e8c" text-anchor="end">净利润率(%)</text></svg>';
  }

  function renderFinance(c){
    var fin = c.demoFinance;
    if(!fin || !fin.table || !fin.table.length){
      return '<div class="module-card">' +
        '<div class="module-head"><h3>财务信息</h3></div>' +
        '<div class="empty-state">报告注明：部分企业虽为上市公司，当前 Demo 环境未接入实时财务接口。<br>可结合年报披露及 MOSS 360 透视中的经营、融资与股权信号综合研判。</div></div>';
    }
    var rows = fin.table.map(function(r){
      return '<tr>' +
        '<td>' + esc(r.year) + '</td>' +
        '<td class="num">' + fmtNum(r.revenue) + '</td>' +
        '<td class="num">' + fmtNum(r.totalProfit) + '</td>' +
        '<td class="num">' + fmtNum(r.netProfit) + '</td>' +
        '<td class="num">' + fmtNum(r.totalAssets) + '</td>' +
        '<td class="num">' + fmtNum(r.totalLiabilities) + '</td>' +
        '<td class="num">' + (r.margin != null ? r.margin.toFixed(2) + '%' : '—') + '</td></tr>';
    }).join('');
    return '<div class="module-card finance-module">' +
      '<div class="module-head">' +
      '<h3>财务信息 <span class="demo-badge-inline">示例数据 · Demo</span></h3>' +
      '<span class="module-meta">币种：' + esc(fin.currency || '人民币') + '</span></div>' +
      '<div class="finance-body">' +
      '<div class="finance-main">' +
      '<div class="chart-row">' +
      '<div class="chart-box"><h4>营业收入总计趋势</h4>' + renderRevenueBarChart(fin.revenueChart) + '</div>' +
      '<div class="chart-box"><h4>利润趋势与利润率</h4>' + renderProfitDualChart(fin.profitChart) + '</div></div>' +
      '<div class="fin-table-wrap">' +
      '<div class="fin-table-title">财务数据表</div>' +
      '<table class="fin-table"><thead><tr>' +
      '<th>年份</th><th>营业收入总计(千元)</th><th>利润总额(千元)</th><th>净利润(千元)</th>' +
      '<th>资产总额(千元)</th><th>负债总额(千元)</th><th>净利润率(%)</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div></div>' +
      (fin.note ? '<aside class="finance-note"><div class="finance-note-label">注</div><p>' + esc(fin.note) + '</p></aside>' : '') +
      '</div></div>';
  }

  function renderMonitorTable(rows, years, labels){
    var head = '<th class="col-idx">序号</th><th>产品分类</th><th>数据类型</th>';
    labels.forEach(function(y){ head += '<th class="num">' + y + '</th>'; });
    head += '<th>计量单位</th>';
    var body = rows.map(function(row, i){
      var cls = row.highlight ? ' class="row-highlight"' : '';
      var cells = '<td class="col-idx">' + (i + 1) + '</td>' +
        '<td>' + esc(row.category) + '</td>' +
        '<td>' + esc(row.dataType) + '</td>';
      row.values.forEach(function(v){
        cells += '<td class="num">' + esc(v === '—' || v == null ? '—' : (typeof v === 'number' ? v.toLocaleString('zh-CN') : v)) + '</td>';
      });
      cells += '<td>' + esc(row.unit) + '</td>';
      return '<tr' + cls + '>' + cells + '</tr>';
    }).join('');
    return '<table class="monitor-table"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table>';
  }

  function renderMonitor(c){
    var mon = c.demoMonitor;
    if(!mon || !mon.annual || !mon.annual.length){
      return '<div class="module-card">' +
        '<div class="module-head"><h3>业务监测</h3></div>' +
        '<div class="empty-state">暂无结构化监测数据，请参见「基本情况」中的 360° 透视分析。</div></div>';
    }
    var sub = state.monitorSub || 'annual';
    var rows = sub === 'quarterly' ? (mon.quarterly || []) : mon.annual;
    var labels = sub === 'quarterly' ? (mon.quarterLabels || []) : (mon.years || []);
    return '<div class="module-card monitor-module">' +
      '<div class="module-head"><h3>业务监测 <span class="demo-badge-inline">示例数据 · Demo</span></h3></div>' +
      '<div class="monitor-toolbar">' +
      '<div class="monitor-tabs" role="tablist">' +
      '<button type="button" class="monitor-tab' + (sub === 'annual' ? ' active' : '') + '" data-monitor-sub="annual" role="tab">年度数据</button>' +
      '<button type="button" class="monitor-tab' + (sub === 'quarterly' ? ' active' : '') + '" data-monitor-sub="quarterly" role="tab">季度数据' +
      (sub === 'quarterly' ? ' <span class="demo-badge-inline">示例</span>' : '') + '</button></div>' +
      '<button type="button" class="module-btn" disabled title="Demo 环境暂不支持导出">导出</button></div>' +
      '<p class="monitor-source">' + esc(mon.sourceNote || '数据来源：MIR DATABANK') + '</p>' +
      '<div class="monitor-table-wrap">' + renderMonitorTable(rows, mon.years, labels) + '</div>' +
      '<div class="monitor-footer">共 ' + rows.length + ' 条 · 100 条/页</div></div>';
  }

  function renderFactories(c){
    var fac = c.demoFactories;
    if(!fac || !fac.rows || !fac.rows.length){
      return '<div class="module-card">' +
        '<div class="module-head"><h3>工厂分布</h3></div>' +
        '<div class="empty-state">暂无工厂分布数据。</div></div>';
    }
    var title = fac.title || ((c.shortName || '') + '产能分布');
    var rows = fac.rows.map(function(r, i){
      var nameCell = r.name
        ? '<span class="factory-link">' + esc(r.name) + '</span>'
        : '—';
      return '<tr>' +
        '<td class="col-idx">' + (i + 1) + '</td>' +
        '<td>' + nameCell + '</td>' +
        '<td>' + esc(r.address) + '</td>' +
        '<td>' + esc(r.status) + '</td>' +
        '<td>' + esc(r.prodTime) + '</td>' +
        '<td>' + esc(r.product) + '</td>' +
        '<td>' + esc(r.industry) + '</td>' +
        '<td class="num">' + esc(r.capacity) + '</td>' +
        '<td>' + esc(r.unit) + '</td></tr>';
    }).join('');
    return '<div class="module-card factory-module">' +
      '<h3 class="factory-title">' + esc(title) + ' <span class="demo-badge-inline">示例数据 · Demo</span></h3>' +
      '<div class="factory-toolbar">' +
      '<button type="button" class="module-btn" disabled title="Demo 环境暂不支持导出">导出</button>' +
      '<button type="button" class="module-btn module-btn-outline" disabled title="Demo 环境暂不支持">工厂分布图</button></div>' +
      '<div class="factory-table-wrap">' +
      '<table class="factory-table"><thead><tr>' +
      '<th class="col-idx">序号</th><th>下属工厂</th><th>工厂地址</th><th>建设状态</th>' +
      '<th>投产时间</th><th>主营产品</th><th>涉及行业</th><th>规划产能</th><th>产能单位</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  }

  function renderTabContent(){
    var c = getCompany(state.company);
    if(!c){
      tabPanelEl.innerHTML = '<div class="empty-state">请选择竞对企业</div>';
      companyTitleEl.textContent = '竞争分析';
      return;
    }
    companyTitleEl.textContent = c.displayName || c.shortName;
    var html = '';
    if(state.tab === 'basic') html = renderBasic(c);
    else if(state.tab === 'finance') html = renderFinance(c);
    else if(state.tab === 'monitor') html = renderMonitor(c);
    else if(state.tab === 'factories') html = renderFactories(c);
    tabPanelEl.innerHTML = html;
  }

  function renderContentNav(){
    contentSidebarEl.innerHTML =
      '<div class="content-sidebar-title">内容目录</div>' +
      TABS.map(function(t){
        var cls = 'content-nav-item' + (t.id === state.tab ? ' active' : '');
        return '<button type="button" class="' + cls + '" data-tab="' + t.id + '">' + t.label + '</button>';
      }).join('');
  }

  function renderCompanyList(){
    companyListEl.innerHTML = companies.map(function(c){
      var cls = 'company-btn' + (c.id === state.company ? ' active' : '');
      return '<button type="button" class="' + cls + '" data-company="' + c.id + '">' + esc(c.shortName) + '</button>';
    }).join('');
  }

  function renderIndustryTabs(){
    if(!industryTabsEl) return;
    industryTabsEl.querySelectorAll('.industry-tab').forEach(function(btn){
      var on = btn.dataset.industry === state.industry;
      btn.classList.toggle('active', on);
      btn.setAttribute('aria-selected', on ? 'true' : 'false');
    });
  }

  function companyIds(){
    return companies.map(function(c){ return c.id; });
  }

  function updateUrl(){
    var params = new URLSearchParams();
    params.set('industry', state.industry);
    params.set('company', state.company);
    params.set('tab', state.tab);
    history.replaceState(null, '', '?' + params.toString());
  }

  function activate(opts){
    if(opts.industry && INDUSTRY_DATA[opts.industry]){
      state.industry = opts.industry;
      companies = buildCompanies(state.industry);
    }
    var ids = companyIds();
    if(opts.company && ids.indexOf(opts.company) >= 0){
      if(opts.company !== state.company) state.monitorSub = 'annual';
      state.company = opts.company;
    } else if(ids.indexOf(state.company) < 0){
      state.company = ids[0] || '';
    }
    if(opts.tab && TABS.some(function(t){ return t.id === opts.tab; })) state.tab = opts.tab;
    if(footerEl && INDUSTRY_DATA[state.industry]){
      footerEl.textContent = '数据来源：' + (INDUSTRY_DATA[state.industry].sourceNote || 'MOSS企业360透视');
    }
    renderIndustryTabs();
    renderCompanyList();
    renderContentNav();
    renderTabContent();
    updateUrl();
  }

  function parseInitParams(params){
    var industry = params.get('industry') || 'robot';
    if(!INDUSTRY_DATA[industry]) industry = 'robot';
    companies = buildCompanies(industry);
    var ids = companyIds();
    var company = params.get('company');
    if(company === 'jcme' || company === 'self') company = ids[0];
    if(!company || ids.indexOf(company) < 0){
      var legacy = params.get('tab');
      if(legacy && legacy.indexOf('comp-') === 0 && ids.indexOf(legacy) >= 0) company = legacy;
      else if(legacy && legacy.indexOf('robot-') === 0 && ids.indexOf(legacy) >= 0) company = legacy;
      else company = ids[0];
    }
    var tab = params.get('tab');
    if(tab === 'self' || tab === 'report') tab = 'basic';
    if(tab && tab.indexOf('comp-') === 0) tab = 'basic';
    if(tab && tab.indexOf('robot-') === 0) tab = 'basic';
    if(!tab || !TABS.some(function(t){ return t.id === tab; })) tab = 'basic';
    return { industry: industry, company: company, tab: tab };
  }

  document.getElementById('company-list').addEventListener('click', function(e){
    var btn = e.target.closest('[data-company]');
    if(btn) activate({ company: btn.dataset.company });
  });

  document.getElementById('content-sidebar').addEventListener('click', function(e){
    var btn = e.target.closest('[data-tab]');
    if(btn) activate({ tab: btn.dataset.tab });
  });

  document.getElementById('tab-panel').addEventListener('click', function(e){
    var subBtn = e.target.closest('[data-monitor-sub]');
    if(subBtn){
      state.monitorSub = subBtn.dataset.monitorSub;
      renderTabContent();
    }
  });

  if(industryTabsEl){
    industryTabsEl.addEventListener('click', function(e){
      var btn = e.target.closest('[data-industry]');
      if(!btn) return;
      activate({ industry: btn.dataset.industry, company: '', tab: 'basic' });
    });
  }

  document.getElementById('search-btn').addEventListener('click', function(){
    var q = document.getElementById('search-input').value.trim();
    var scope = document.getElementById('search-scope').value;
    if(!q){
      alert('请输入搜索关键词');
      return;
    }
    var matched = companies.filter(function(c){
      var p = c.profile || {};
      var hay = (c.displayName || '') + ' ' + (c.shortName || '') + ' ' + (c.mainBusiness || '') + ' ' + (p.industry || '') + ' ' + (c.mainProducts || []).join(' ');
      if(scope === 'company') hay = (c.displayName || '') + ' ' + (c.shortName || '');
      if(scope === 'product') hay = (c.mainProducts || []).join(' ');
      if(scope === 'industry') hay = p.industry || '';
      return hay.indexOf(q) >= 0;
    });
    if(matched.length){
      activate({ company: matched[0].id, tab: 'basic' });
    } else {
      alert('当前赛道未找到匹配企业：「' + q + '」');
    }
  });

  document.getElementById('search-input').addEventListener('keydown', function(e){
    if(e.key === 'Enter') document.getElementById('search-btn').click();
  });

  activate(parseInitParams(new URLSearchParams(window.location.search)));
})();
</script>
</body>
</html>
