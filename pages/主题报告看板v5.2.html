<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>主题报告 - 京城机电产业研究与市场分析平台</title>
<link rel="stylesheet" href="../assets/subpage-layout.css">
<link rel="stylesheet" href="../assets/subpage-nav.css">
<link rel="stylesheet" href="../assets/entry-list.css">
<link rel="stylesheet" href="../assets/theme-report-page.css">
</head>
<body>
<header class="platform-nav-outer">
  <div class="platform-nav-inner">
    <div id="platform-nav-mount" data-active="report"></div>
  </div>
</header>
<div class="subpage-with-nav">
  <div class="subpage-wrap">
    <header class="subpage-header theme-report-header">
      <div class="subpage-header-text">
        <h1>主题报告</h1>
        <p>机电院专题研究成果汇总，按标题、时间与摘要逐条展示；未上传文档点击链接后提示「未上传」。</p>
      </div>
      <button type="button" class="theme-report-upload" id="report-upload-btn">上传文档</button>
      <input type="file" id="report-upload-input" hidden accept=".pdf,.doc,.docx,.html,.htm,.md">
    </header>

    <div class="subpage-body theme-report-body theme-report-body-full">
      <main class="subpage-content report-detail-panel" id="report-detail-list" aria-live="polite"></main>
    </div>

    <footer class="subpage-footer">京城机电产业研究与市场分析平台 · 主题报告</footer>
  </div>
</div>
<div class="report-toast" id="report-toast" role="status" aria-live="polite"></div>

<script src="../assets/subpage-nav.js"></script>
<script src="../assets/demo-data.js"></script>
<script>
(function(){
  var reports = (window.DEMO_DATA && window.DEMO_DATA.recommendedReports) || [];
  var detailEl = document.getElementById('report-detail-list');
  var toastEl = document.getElementById('report-toast');
  var toastTimer;

  function esc(s){
    if(s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function showToast(msg){
    if(!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('is-show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){
      toastEl.classList.remove('is-show');
    }, 2200);
  }

  function resolveReportUrl(url){
    if(!url || !String(url).trim()) return '';
    var href = String(url).trim();
    if(/^https?:\/\//i.test(href)) return href;
    if(href.indexOf('pages/') === 0) return href.replace(/^pages\//, '');
    if(href.indexOf('../') === 0) return href.replace(/^\.\.\//, '');
    return href;
  }

  function renderEntryLink(text, href, onMissing){
    if(href){
      return '<a class="entry-link" href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(text) + '</a>';
    }
    return '<button type="button" class="entry-link entry-link-btn">' + esc(text) + '</button>';
  }

  function renderDetails(){
    if(!detailEl) return;
    detailEl.innerHTML = '<div class="entry-list">' + reports.map(function(r){
      var href = resolveReportUrl(r.url);
      var linkHtml = renderEntryLink(r.title, href);
      return '<article class="entry-item" id="report-' + r.id + '">' +
        '<div class="entry-head"><strong class="entry-title">' + esc(r.title) + '</strong>' +
        '<span class="entry-dot"> · </span><span class="entry-date">' + esc(r.date) + '</span></div>' +
        '<p class="entry-summary">' + esc(r.summary || '—') + '</p>' +
        linkHtml +
      '</article>';
    }).join('') + '</div>';

    detailEl.querySelectorAll('.entry-link-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        showToast('未上传');
      });
    });
  }

  renderDetails();

  var uploadBtn = document.getElementById('report-upload-btn');
  var uploadInput = document.getElementById('report-upload-input');
  if(uploadBtn && uploadInput){
    uploadBtn.addEventListener('click', function(){
      uploadInput.click();
    });
    uploadInput.addEventListener('change', function(){
      if(!uploadInput.files || !uploadInput.files.length) return;
      showToast('「' + uploadInput.files[0].name + '」上传功能暂未开放');
      uploadInput.value = '';
    });
  }
})();
</script>
</body>
</html>
