<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>主题报告 - 京城机电产业研究与市场分析平台</title>
<link rel="stylesheet" href="../assets/subpage-layout.css">
<link rel="stylesheet" href="../assets/subpage-nav.css">
<link rel="stylesheet" href="../assets/theme-report-page.css">
</head>
<body>
<header class="platform-nav-outer">
  <div class="platform-nav-inner">
    <div id="platform-nav-mount" data-active="report"></div>
  </div>
</header>
<div class="subpage-with-nav">
  <div class="subpage-wrap">
    <header class="subpage-header theme-report-header">
      <div class="subpage-header-text">
        <h1>主题报告</h1>
        <p>左侧选择报告条目，右侧在线预览全文；未上传文档点击后提示「暂未上传」。</p>
      </div>
      <button type="button" class="theme-report-upload" id="report-upload-btn">上传文档</button>
      <input type="file" id="report-upload-input" hidden accept=".pdf,.doc,.docx,.html,.htm,.md">
    </header>

    <div class="subpage-body">
      <nav class="subpage-sidebar" id="report-list" aria-label="主题报告列表"></nav>
      <main class="subpage-content report-preview-panel" id="report-preview" aria-live="polite"></main>
    </div>

    <footer class="subpage-footer">京城机电产业研究与市场分析平台 · 主题报告</footer>
  </div>
</div>
<div class="report-toast" id="report-toast" role="status" aria-live="polite"></div>

<script src="../assets/subpage-nav.js"></script>
<script src="../assets/demo-data.js"></script>
<script>
(function(){
  var reports = (window.DEMO_DATA && window.DEMO_DATA.recommendedReports) || [];
  var listEl = document.getElementById('report-list');
  var previewEl = document.getElementById('report-preview');
  var toastEl = document.getElementById('report-toast');
  var toastTimer;
  var activeId = null;

  function esc(s){
    if(s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function showToast(msg){
    if(!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('is-show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){
      toastEl.classList.remove('is-show');
    }, 2200);
  }

  function getReport(id){
    for(var i = 0; i < reports.length; i++){
      if(String(reports[i].id) === String(id)) return reports[i];
    }
    return reports[0] || null;
  }

  function resolveReportUrl(url){
    if(!url || !String(url).trim()) return '';
    var href = String(url).trim();
    if(/^https?:\/\//i.test(href)) return href;
    if(href.indexOf('pages/') === 0) return href.replace(/^pages\//, '');
    if(href.indexOf('../') === 0) return href.replace(/^\.\.\//, '');
    return href;
  }

  function renderList(){
    if(!listEl) return;
    listEl.innerHTML = reports.map(function(r){
      var active = String(r.id) === String(activeId) ? ' active' : '';
      return '<button type="button" class="report-list-item' + active + '" data-id="' + r.id + '">' +
        '<div class="item-title">' + esc(r.title) + '</div>' +
        '<div class="item-meta">' +
          '<span class="item-tag">' + esc(r.author || '—') + '</span>' +
          '<span class="item-tag date">' + esc(r.date) + '</span>' +
        '</div></button>';
    }).join('');

    listEl.querySelectorAll('.report-list-item').forEach(function(btn){
      btn.addEventListener('click', function(){
        selectReport(btn.dataset.id, true);
      });
    });
  }

  function renderPreview(report, showPendingToast){
    if(!previewEl || !report) return;
    var previewUrl = resolveReportUrl(report.url);
    var hasUrl = !!previewUrl;
    var head = '<div class="report-preview-head">' +
      '<h2>' + esc(report.title) + '</h2>' +
      '<span class="report-preview-meta">' + esc(report.author || '—') + ' · ' + esc(report.date) + '</span>';

    if(hasUrl){
      head += '<a class="report-preview-open" href="' + esc(previewUrl) + '" target="_blank" rel="noopener">新窗口打开</a>';
    }
    head += '</div>';

    var body;
    if(hasUrl){
      body = '<div class="report-preview-body">' +
        '<iframe class="report-preview-frame" title="' + esc(report.title) + '" src="' + esc(previewUrl) + '"></iframe>' +
        '</div>';
    } else {
      body = '<div class="report-preview-body">' +
        '<div class="report-preview-empty">' +
          '<div class="empty-icon">📄</div>' +
          '<h3>暂未上传</h3>' +
          '<p>该报告尚未上传至平台，请通过「上传文档」补充后预览。</p>' +
        '</div></div>';
      if(showPendingToast) showToast('暂未上传');
    }

    previewEl.innerHTML = head + body;
  }

  function selectReport(id, showPendingToast){
    activeId = id;
    renderList();
    renderPreview(getReport(id), showPendingToast);
    var params = new URLSearchParams(window.location.search);
    params.set('id', id);
    history.replaceState(null, '', '?' + params.toString());
  }

  var params = new URLSearchParams(window.location.search);
  var initialId = params.get('id');
  if(!getReport(initialId) && reports.length) initialId = reports[0].id;
  if(initialId) selectReport(initialId, false);

  var uploadBtn = document.getElementById('report-upload-btn');
  var uploadInput = document.getElementById('report-upload-input');
  if(uploadBtn && uploadInput){
    uploadBtn.addEventListener('click', function(){
      uploadInput.click();
    });
    uploadInput.addEventListener('change', function(){
      if(!uploadInput.files || !uploadInput.files.length) return;
      showToast('「' + uploadInput.files[0].name + '」上传功能暂未开放');
      uploadInput.value = '';
    });
  }
})();
</script>
</body>
</html>
