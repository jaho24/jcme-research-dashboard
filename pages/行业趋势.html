<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>行业趋势 - 京城机电产业研究与市场分析平台</title>
<link rel="stylesheet" href="../assets/subpage-layout.css">
<link rel="stylesheet" href="../assets/subpage-nav.css">
<link rel="stylesheet" href="../assets/trend-page.css">
</head>
<body>
<header class="platform-nav-outer">
  <div class="platform-nav-inner">
    <div id="platform-nav-mount" data-active="trend"></div>
  </div>
</header>
<div class="subpage-with-nav">

  <div class="subpage-wrap">
  <header class="subpage-header">
    <h1>行业趋势分析 <span class="subpage-badge">MOSS数据</span></h1>
    <p>聚焦工业机器人与数控机床两大赛道，汇总市场规模、产业链节点与政策热点，辅助战略研判。</p>
  </header>

  <div class="subpage-body">
    <nav class="subpage-sidebar" id="sidebar" aria-label="行业趋势目录">
      <div class="sidebar-industry-switch">
        <button type="button" class="industry-btn active" data-industry="robot">工业机器人</button>
        <button type="button" class="industry-btn" data-industry="machine">数控机床</button>
      </div>
      <div class="sidebar-industry-title" id="sidebar-title">工业机器人</div>
      <div class="nav-group-label">数据目录</div>
      <button type="button" class="nav-item active" data-view="overview">数据定义 / 首页概览</button>
      <button type="button" class="nav-item" data-view="chain">产业链图谱</button>
      <button type="button" class="nav-item" data-view="finance">上市公司财务数据</button>
      <button type="button" class="nav-item" data-view="hotspot">近期热点</button>
      <div class="nav-group-label" id="report-nav-group">深度报告</div>
      <a class="nav-item nav-item-link" id="robot-report-link" href="工业机器人行业战略洞察报告.html">工业机器人战略洞察报告</a>
    </nav>

    <main class="subpage-content" id="content" aria-live="polite"></main>
  </div>

  <footer class="subpage-footer">京城机电产业研究与市场分析平台 · 行业趋势分析</footer>
  </div>
</div>

<script src="../assets/subpage-nav.js"></script>
<script src="../assets/demo-data.js"></script>
<script src="../assets/trend-finance-data.js"></script>
<script src="../assets/industry-chain-data.js"></script>
<script>
(function(){
  var D = window.DEMO_DATA;
  var FIN = window.TREND_FINANCE_DATA;
  var CHAIN = window.INDUSTRY_CHAIN_DATA;
  var contentEl = document.getElementById('content');
  var state = { industry: 'robot', view: 'overview', period: 'annual', metric: 'revenue', hideValues: false, chainNode: null };

  var INDUSTRIES = {
    robot: { label: '工业机器人', short: '机器人' },
    machine: { label: '数控机床', short: '机床' }
  };

  function fmtNum(n){
    if(n >= 10000) return (n / 10000).toFixed(1) + '万';
    return n.toLocaleString('zh-CN');
  }

  function scaleY(val, maxVal, top, bottom){
    return bottom - (val / maxVal) * (bottom - top);
  }

  function renderGroupedBarChart(years, seriesList){
    var W = 480, H = 220, padL = 44, padR = 12, padT = 20, padB = 36;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var allVals = [];
    seriesList.forEach(function(s){ allVals = allVals.concat(s.values); });
    var maxV = Math.max.apply(null, allVals) * 1.12;
    var groupW = plotW / years.length;
    var barW = Math.min(18, (groupW - 8) / seriesList.length);
    var gap = (groupW - barW * seriesList.length) / (seriesList.length + 1);
    var bars = '';
    years.forEach(function(y, gi){
      seriesList.forEach(function(s, si){
        var v = s.values[gi];
        if(v == null || v === 0) return;
        var h = (v / maxV) * plotH;
        var x = padL + gi * groupW + gap + si * (barW + gap);
        var yPos = padT + plotH - h;
        bars += '<rect x="' + x + '" y="' + yPos + '" width="' + barW + '" height="' + h + '" rx="2" fill="' + s.color + '"/>';
        if(h > 16) bars += '<text x="' + (x + barW/2) + '" y="' + (yPos - 3) + '" font-size="8" fill="#64748b" text-anchor="middle">' + v + '</text>';
      });
      var lx = padL + gi * groupW + groupW / 2;
      bars += '<text x="' + lx + '" y="' + (H - 6) + '" font-size="10" fill="#94a3b8" text-anchor="middle">' + y + '</text>';
    });
    var grid = '';
    for(var g = 0; g <= 4; g++){
      var gy = padT + (g / 4) * plotH;
      grid += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (padL + plotW) + '" y2="' + gy + '" stroke="#e2e8f0" stroke-dasharray="3,3"/>';
    }
    return '<svg viewBox="0 0 ' + W + ' ' + H + '">' +
      grid +
      '<line x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (padT + plotH) + '" stroke="#cbd5e1"/>' +
      '<line x1="' + padL + '" y1="' + (padT + plotH) + '" x2="' + (padL + plotW) + '" y2="' + (padT + plotH) + '" stroke="#cbd5e1"/>' +
      bars + '</svg>';
  }

  function renderLineChart(years, values, color){
    var W = 480, H = 220, padL = 44, padR = 12, padT = 20, padB = 36;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var maxV = Math.max.apply(null, values) * 1.15;
    var pts = values.map(function(v, i){
      var x = padL + (i / (values.length - 1)) * plotW;
      var y = scaleY(v, maxV, padT, padT + plotH);
      return x + ',' + y;
    });
    var area = 'M' + padL + ',' + (padT + plotH) + ' L' + pts.join(' L') + ' L' + (padL + plotW) + ',' + (padT + plotH) + ' Z';
    var labels = years.map(function(y, i){
      var x = padL + (i / (years.length - 1)) * plotW;
      return '<text x="' + x + '" y="' + (H - 6) + '" font-size="10" fill="#94a3b8" text-anchor="middle">' + y + '</text>';
    }).join('');
    var dots = values.map(function(v, i){
      var x = padL + (i / (values.length - 1)) * plotW;
      var y = scaleY(v, maxV, padT, padT + plotH);
      return '<circle cx="' + x + '" cy="' + y + '" r="3.5" fill="' + color + '"/>';
    }).join('');
    return '<svg viewBox="0 0 ' + W + ' ' + H + '"><path d="' + area + '" fill="' + color + '" fill-opacity="0.12"/><polyline points="' + pts.join(' ') + '" fill="none" stroke="' + color + '" stroke-width="2"/>' + dots + labels + '</svg>';
  }

  function fmtFinanceNum(n){
    return Number(n).toLocaleString('zh-CN');
  }

  function renderFinanceTable(years, rows){
    var ths = '<th>指标名称</th>' + years.map(function(y){ return '<th class="num">' + y + '</th>'; }).join('');
    var trs = rows.map(function(row){
      var cls = row.isTotal ? ' class="total-row"' : '';
      var tds = '<td class="row-name">' + row.name + '</td>';
      row.values.forEach(function(v){
        tds += '<td class="num">' + fmtFinanceNum(v) + '</td>';
      });
      return '<tr' + cls + '>' + tds + '</tr>';
    }).join('');
    return '<table class="finance-table"><thead><tr>' + ths + '</tr></thead><tbody>' + trs + '</tbody></table>';
  }

  function renderStackedBarChart(years, rows, hideValues){
    var W = 520, H = 280, padL = 52, padR = 16, padT = 24, padB = 44;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var segments = rows.filter(function(r){ return !r.isTotal; });
    var totals = years.map(function(_, yi){
      return segments.reduce(function(sum, row){ return sum + row.values[yi]; }, 0);
    });
    var maxV = Math.max.apply(null, totals) * 1.08;
    var barW = Math.min(56, (plotW / years.length) * 0.55);
    var groupW = plotW / years.length;
    var svg = '';
    var grid = '';
    var ySteps = 7;
    for(var g = 0; g <= ySteps; g++){
      var gy = padT + (g / ySteps) * plotH;
      var gv = Math.round(maxV * (1 - g / ySteps) / 1000) * 1000;
      grid += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (padL + plotW) + '" y2="' + gy + '" stroke="#e2e8f0" stroke-dasharray="3,3"/>';
      if(g % 2 === 0) grid += '<text x="' + (padL - 6) + '" y="' + (gy + 3) + '" font-size="9" fill="#94a3b8" text-anchor="end">' + gv.toLocaleString('zh-CN') + '</text>';
    }
    years.forEach(function(y, yi){
      var cx = padL + yi * groupW + groupW / 2;
      var stackBottom = padT + plotH;
      segments.forEach(function(row){
        var v = row.values[yi];
        if(!v) return;
        var h = (v / maxV) * plotH;
        var yPos = stackBottom - h;
        svg += '<rect x="' + (cx - barW / 2) + '" y="' + yPos + '" width="' + barW + '" height="' + h + '" fill="' + row.color + '" rx="1"/>';
        if(!hideValues && h >= 14){
          svg += '<text x="' + cx + '" y="' + (yPos + h / 2 + 3) + '" font-size="7" fill="#fff" text-anchor="middle" font-weight="600">' + fmtFinanceNum(v) + '</text>';
        }
        stackBottom = yPos;
      });
      svg += '<text x="' + cx + '" y="' + (H - 10) + '" font-size="10" fill="#64748b" text-anchor="middle" transform="rotate(-25 ' + cx + ' ' + (H - 10) + ')">' + y + '</text>';
    });
    return '<svg class="finance-chart-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="堆叠柱状图">' +
      grid +
      '<line x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (padT + plotH) + '" stroke="#cbd5e1"/>' +
      '<line x1="' + padL + '" y1="' + (padT + plotH) + '" x2="' + (padL + plotW) + '" y2="' + (padT + plotH) + '" stroke="#cbd5e1"/>' +
      svg + '</svg>';
  }

  function renderOverview(industry){
    var t = D.trends[industry];
    var kpis = t.kpis.map(function(k){
      return '<div class="kpi"><div class="lk">' + k.label + '</div><div class="lv">' + k.value + '</div><div class="lu">' + k.unit + '</div></div>';
    }).join('');
    var globalRows = t.global.rows.map(function(r){
      return '<tr><td>' + r.join('</td><td>') + '</td></tr>';
    }).join('');
    var globalTh = t.global.headers.map(function(h){ return '<th>' + h + '</th>'; }).join('');
    var reportBanner = industry === 'robot'
      ? '<div class="report-entry-banner">' +
          '<div class="report-entry-text">' +
            '<strong>战略洞察报告</strong>' +
            '<p>完整版行业研究：市场格局、竞争态势、产业链自主化、具身智能与京城机电战略建议。</p>' +
          '</div>' +
          '<a class="report-entry-btn" href="工业机器人行业战略洞察报告.html">阅读全文 →</a>' +
        '</div>'
      : '';
    return '<div class="content-title">' + t.label + ' — 首页概览</div>' +
      '<div class="content-meta"><span class="tag tag-blue">' + t.label + '</span><span class="content-date">来源：' + t.source + '</span></div>' +
      reportBanner +
      '<div class="insight-box"><strong>数据定义：</strong>' + t.definition + '</div>' +
      '<p class="content-summary">' + t.description + '</p>' +
      '<div class="kpi-row">' + kpis + '</div>' +
      '<div class="content-section-title">全球市场</div>' +
      '<table class="std-table"><thead><tr>' + globalTh + '</tr></thead><tbody>' + globalRows + '</tbody></table>' +
      '<div class="content-section-title">' + t.chartTitle + '</div>' +
      '<div class="chart-box">' + (t.chartType === 'bar'
        ? renderGroupedBarChart(t.years, t.series)
        : renderLineChart(t.years, t.series[0].values, t.series[0].color)) +
      '<div class="chart-cap"><span>单位：' + t.unit + '</span><span>来源：' + t.source + '</span></div></div>';
  }

  function renderFinance(industry){
    var fin = FIN[industry];
    var indLabel = INDUSTRIES[industry].label;
    var metricLabel = fin.metricLabels[state.metric];
    var dataset = fin[state.period][state.metric];
    var years = dataset.years;
    var rows = dataset.rows;
    var isDemo = state.period === 'quarterly' || dataset.demo;
    var rowCount = rows.filter(function(r){ return !r.isTotal; }).length;

    var periodTabs = ['annual', 'quarterly'].map(function(p){
      var label = p === 'annual' ? '年度' : '季度';
      var demo = p === 'quarterly' ? ' <span class="demo-tag">Demo</span>' : '';
      return '<button type="button" class="period-tab' + (state.period === p ? ' active' : '') + '" data-period="' + p + '">' + label + demo + '</button>';
    }).join('');

    var metricTabs = fin.metrics.map(function(m){
      return '<button type="button" class="metric-tab' + (state.metric === m ? ' active' : '') + '" data-metric="' + m + '">' + fin.metricLabels[m] + '</button>';
    }).join('');

    var chart = renderStackedBarChart(years, rows, state.hideValues);
    var legend = rows.filter(function(r){ return !r.isTotal; }).map(function(r){
      return '<span class="finance-legend-item"><i style="background:' + r.color + '"></i>' + r.name + '</span>';
    }).join('');

    var demoNote = isDemo ? '<span class="finance-demo-badge">示例数据 · Demo</span>' : '';

    return '<div class="finance-view">' +
      '<div class="finance-top">' +
        '<div class="period-tabs finance-period-tabs" role="tablist">' + periodTabs + '</div>' +
        '<div class="metric-tabs" role="tablist">' + metricTabs + '</div>' +
      '</div>' +
      '<div class="data-desc finance-desc">' + fin.description + ' 数据来源：' + fin.source + '。' + demoNote + '</div>' +
      '<div class="finance-split">' +
        '<div class="finance-panel">' +
          '<div class="finance-panel-head">' +
            '<div><h3>总体分析 - ' + metricLabel + '数据</h3>' +
            '<div class="finance-panel-sub">数据来源：' + fin.source + ' · 单位：' + fin.unit + '</div></div>' +
            '<div class="finance-toolbar">' +
              '<button type="button" class="finance-btn-export">数据导出</button>' +
              '<select class="finance-select" disabled><option>指标：已选中 ' + rowCount + ' 项</option></select>' +
              '<select class="finance-select" disabled><option>时间：已选中 ' + years.length + ' 项</option></select>' +
            '</div>' +
          '</div>' +
          '<div class="finance-panel-body">' + renderFinanceTable(years, rows) + '</div>' +
          '<div class="finance-table-foot"><span>10 条/页</span><span class="finance-pagination">‹ 1 ›</span></div>' +
        '</div>' +
        '<div class="finance-panel">' +
          '<div class="finance-panel-head">' +
            '<div><h3>总体分析 - 柱状图</h3>' +
            '<div class="finance-panel-sub">数据来源：' + fin.source + ' · 单位：' + fin.unit + '</div></div>' +
            '<div class="finance-toolbar">' +
              '<select class="finance-select" disabled><option>指标：已选中 ' + rowCount + ' 项</option></select>' +
              '<select class="finance-select" disabled><option>时间：已选中 ' + years.length + ' 项</option></select>' +
              '<select class="finance-select" disabled><option>图表类型：柱状图</option></select>' +
              '<button type="button" class="finance-btn-toggle' + (state.hideValues ? ' muted' : '') + '" data-toggle-values="1">' + (state.hideValues ? '显示数值' : '隐藏数值') + '</button>' +
            '</div>' +
          '</div>' +
          '<div class="finance-panel-body finance-chart-body">' + chart + '<div class="finance-legend">' + legend + '</div></div>' +
        '</div>' +
      '</div>' +
      '<p class="finance-footnote">' + indLabel + ' · 上市公司财务数据汇总 · ' + fin.source + '</p>' +
    '</div>';
  }

  function renderChainNodeItems(nodes, side){
    return nodes.map(function(n, i){
      var key = side + '-' + i;
      var active = state.chainNode === key ? ' active' : '';
      return '<li role="button" tabindex="0" class="' + active.trim() + '" data-chain-node="' + key + '">' +
        '<span>' + n.name + '</span>' +
        '<span class="chain-node-pill">' + fmtNum(n.count) + ' 家</span></li>';
    }).join('');
  }

  function getChainNodeData(industry, nodeKey){
    var c = CHAIN[industry];
    if(nodeKey === 'core') return { name: c.name, count: c.totalEnterprises, enterprises: c.coreEnterprises, isCore: true };
    var parts = nodeKey.split('-');
    var side = parts[0], idx = parseInt(parts[1], 10);
    var list = side === 'upstream' ? c.upstream : c.downstream;
    var node = list[idx];
    return node ? { name: node.name, count: node.count, enterprises: node.enterprises, isCore: false } : null;
  }

  function renderEnterprisePanel(industry, nodeKey){
    if(!nodeKey) return '<div id="chain-ent-panel" class="chain-enterprise-panel" hidden></div>';
    var data = getChainNodeData(industry, nodeKey);
    if(!data) return '<div id="chain-ent-panel" class="chain-enterprise-panel" hidden></div>';
    var ents = data.enterprises || [];
    var mdCount = ents.filter(function(e){ return e.source === 'md'; }).length;
    var demoHint = mdCount < ents.length ? '<span class="demo-hint">代表企业样本 · Demo</span>' : '';
    var rows = ents.map(function(e){
      var tagCls = e.source === 'md' ? 'md' : 'demo';
      var tagLabel = e.source === 'md' ? '报告数据' : '样本';
      return '<li><span class="chain-ent-name">' + e.name + '</span>' +
        '<span class="chain-ent-region">' + (e.region || '—') + '</span>' +
        '<span class="chain-ent-type">' + (e.type || '—') + '</span>' +
        '<span class="chain-ent-tag ' + tagCls + '">' + tagLabel + '</span></li>';
    }).join('');
    return '<div id="chain-ent-panel" class="chain-enterprise-panel">' +
      '<div class="chain-ent-head">' +
        '<div><h3>' + data.name + ' · 企业名单（' + ents.length + ' 家代表企业）</h3>' +
        '<div class="chain-ent-meta">节点注册企业 ' + fmtNum(data.count) + ' 家 · 以下为代表样本' + demoHint + '</div></div>' +
        '<button type="button" class="chain-ent-close" aria-label="关闭">×</button>' +
      '</div>' +
      '<ul class="chain-ent-list">' + rows + '</ul>' +
    '</div>';
  }

  function renderChain(industry){
    var c = CHAIN[industry];
    var upstreamList = renderChainNodeItems(c.upstream, 'upstream');
    var downstreamList = renderChainNodeItems(c.downstream, 'downstream');
    var coreActive = state.chainNode === 'core' ? ' active' : '';
    var badges = [
      '<span class="chain-badge">范围：' + c.scope + '</span>',
      '<span class="chain-badge green">上游节点 ' + c.stats.upstreamNodes + ' 个 / ' + c.stats.upstreamCategories + ' 类</span>',
      '<span class="chain-badge purple">下游节点 ' + c.stats.downstreamNodes + ' 个 / ' + c.stats.downstreamCategories + ' 类</span>',
      '<span class="chain-badge">企业总数 ' + fmtNum(c.totalEnterprises) + ' 家</span>'
    ].join('');

    return '<div class="chain-dark-wrap">' +
      '<div class="chain-search-bar">' +
        '<label>产业链节点</label><input type="text" placeholder="请输入节点名称" value="" readonly>' +
        '<label>地域</label><select disabled><option>全国</option></select>' +
        '<select disabled><option>省份</option></select>' +
        '<select disabled><option>城市</option></select>' +
        '<div class="chain-search-actions">' +
          '<button type="button" class="chain-btn chain-btn-reset">重置</button>' +
          '<button type="button" class="chain-btn chain-btn-search">查询</button>' +
        '</div>' +
      '</div>' +
      '<div class="chain-header-card">' +
        '<h2>' + c.name + ' — 产业链图谱</h2>' +
        '<div class="chain-badges">' + badges + '</div>' +
      '</div>' +
      '<div class="chain-stat-row">' +
        '<div class="chain-stat-card upstream"><div class="label">上游节点</div><div class="value">' + c.stats.upstreamNodes + '</div></div>' +
        '<div class="chain-stat-card core"><div class="label">中心节点企业</div><div class="value">' + fmtNum(c.totalEnterprises) + '</div></div>' +
        '<div class="chain-stat-card downstream"><div class="label">下游节点</div><div class="value">' + c.stats.downstreamNodes + '</div></div>' +
      '</div>' +
      '<div class="chain-flow-title">上下游图谱 <span style="font-weight:400;font-size:11px;color:#64748b">（点击节点查看企业名单）</span></div>' +
      '<div class="chain-flow">' +
        '<div class="chain-col upstream">' +
          '<div class="chain-col-head">生产原料 · 上游</div>' +
          '<ul class="chain-node-list" data-side="upstream">' + upstreamList + '</ul>' +
        '</div>' +
        '<div class="chain-flow-arrow">→</div>' +
        '<div class="chain-core' + coreActive + '" data-chain-node="core">' +
          '<div class="core-tag">核心节点</div>' +
          '<div class="core-name">' + c.name + '</div>' +
          '<div class="core-en">' + c.nameEn + '</div>' +
          '<div class="core-count">' + fmtNum(c.totalEnterprises) + ' 家企业</div>' +
          '<button type="button" class="core-btn" data-chain-node="core">查看企业名单</button>' +
        '</div>' +
        '<div class="chain-flow-arrow">→</div>' +
        '<div class="chain-col downstream">' +
          '<div class="chain-col-head">应用领域 · 下游</div>' +
          '<ul class="chain-node-list" data-side="downstream">' + downstreamList + '</ul>' +
        '</div>' +
      '</div>' +
      renderEnterprisePanel(industry, state.chainNode) +
      '<div class="chain-source-note">数据来源：' + c.source + ' · 报告日期 ' + c.reportDate + '</div>' +
    '</div>';
  }

  function renderHotspot(industry){
    var hot = D.trendHotspots[industry];
    var items = hot.map(function(h){
      return '<li><span class="news-date">' + h.date + '</span><span class="tag tag-blue">' + h.tag + '</span><span>' + h.title + '</span></li>';
    }).join('');
    var label = INDUSTRIES[industry].label;
    return '<div class="content-title">' + label + ' — 近期热点</div>' +
      '<p class="content-summary">汇总' + label + '赛道近期市场动态、政策信号与技术突破，辅助快速把握行业脉搏。</p>' +
      '<ul class="news-list">' + items + '</ul>';
  }

  function render(){
    var html = '';
    switch(state.view){
      case 'overview': html = renderOverview(state.industry); break;
      case 'finance': html = renderFinance(state.industry); break;
      case 'chain': html = renderChain(state.industry); break;
      case 'hotspot': html = renderHotspot(state.industry); break;
    }
    contentEl.innerHTML = html;
    bindContentEvents();
  }

  function showChainNode(nodeKey){
    state.chainNode = state.chainNode === nodeKey ? null : nodeKey;
    if(state.view !== 'chain') return;
    var wrap = contentEl.querySelector('.chain-dark-wrap');
    if(!wrap) return;
    wrap.querySelectorAll('[data-chain-node]').forEach(function(el){
      var key = el.dataset.chainNode;
      var isLi = el.tagName === 'LI';
      var isCore = key === 'core';
      if(isLi) el.classList.toggle('active', key === state.chainNode);
      if(isCore && el.classList.contains('chain-core')) el.classList.toggle('active', key === state.chainNode);
    });
    var oldPanel = wrap.querySelector('#chain-ent-panel');
    var panelHtml = renderEnterprisePanel(state.industry, state.chainNode);
    if(oldPanel) oldPanel.outerHTML = panelHtml;
    else wrap.insertAdjacentHTML('beforeend', panelHtml);
    var panel = wrap.querySelector('#chain-ent-panel');
    if(panel && !panel.hasAttribute('hidden')){
      var closeBtn = panel.querySelector('.chain-ent-close');
      if(closeBtn) closeBtn.addEventListener('click', function(){ showChainNode(state.chainNode); });
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  function bindContentEvents(){
    contentEl.querySelectorAll('[data-period]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.period = btn.dataset.period;
        render();
      });
    });
    contentEl.querySelectorAll('[data-metric]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.metric = btn.dataset.metric;
        render();
      });
    });
    var toggleBtn = contentEl.querySelector('[data-toggle-values]');
    if(toggleBtn){
      toggleBtn.addEventListener('click', function(){
        state.hideValues = !state.hideValues;
        render();
      });
    }
    if(state.view === 'chain'){
      contentEl.querySelectorAll('[data-chain-node]').forEach(function(el){
        el.addEventListener('click', function(e){
          if(e.target.closest('.chain-ent-close')) return;
          showChainNode(el.dataset.chainNode);
        });
        if(el.tagName === 'LI'){
          el.addEventListener('keydown', function(e){
            if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); showChainNode(el.dataset.chainNode); }
          });
        }
      });
      var closeBtn = contentEl.querySelector('.chain-ent-close');
      if(closeBtn) closeBtn.addEventListener('click', function(){ showChainNode(state.chainNode); });
    }
  }

  function syncUI(){
    document.querySelectorAll('.industry-btn').forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.industry === state.industry);
    });
    document.getElementById('sidebar-title').textContent = INDUSTRIES[state.industry].label;
    document.querySelectorAll('#sidebar [data-view]').forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.view === state.view);
    });
    var reportGroup = document.getElementById('report-nav-group');
    var reportLink = document.getElementById('robot-report-link');
    var showReport = state.industry === 'robot';
    if(reportGroup) reportGroup.hidden = !showReport;
    if(reportLink) reportLink.hidden = !showReport;
  }

  function updateURL(){
    var params = new URLSearchParams();
    params.set('industry', state.industry);
    params.set('view', state.view);
    history.replaceState(null, '', '?' + params.toString());
  }

  function setIndustry(industry){
    state.industry = industry;
    state.chainNode = null;
    syncUI();
    render();
    updateURL();
  }

  function setView(view){
    state.view = view;
    if(view !== 'finance'){ state.period = 'annual'; state.metric = 'revenue'; state.hideValues = false; }
    if(view !== 'chain') state.chainNode = null;
    syncUI();
    render();
    updateURL();
  }

  document.getElementById('sidebar').addEventListener('click', function(e){
    var indBtn = e.target.closest('[data-industry]');
    if(indBtn){ setIndustry(indBtn.dataset.industry); return; }
    var viewBtn = e.target.closest('[data-view]');
    if(viewBtn){ setView(viewBtn.dataset.view); }
  });

  var params = new URLSearchParams(window.location.search);
  var ind = params.get('industry');
  var view = params.get('view');
  if(ind === 'robot' || ind === 'machine') state.industry = ind;
  if(view === 'market') view = 'finance';
  if(['overview', 'finance', 'chain', 'hotspot'].indexOf(view) >= 0) state.view = view;
  syncUI();
  render();
})();
</script>
</body>
</html>
