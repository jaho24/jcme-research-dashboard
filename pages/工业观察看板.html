<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>工业观察看板 - 京城机电产业研究与市场分析平台</title>
<link rel="stylesheet" href="../assets/subpage-layout.css">
<link rel="stylesheet" href="../assets/subpage-nav.css">
<link rel="stylesheet" href="../assets/entry-list.css">
<style>
/* 工业观察：左行业目录 + 右页签内容（参考产业政策界面） */
.io-sidebar .sidebar-heading {
  font-size: 16px;
  font-weight: 700;
  color: var(--slate-900);
  padding: 18px 16px 12px;
  border-bottom: 1px solid var(--slate-100);
}
.io-industry-list { list-style: none; padding: 8px 0 12px; }
.io-industry-list li { margin: 0; }
.io-industry-btn {
  display: block;
  width: 100%;
  text-align: left;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  color: var(--blue-600);
  padding: 9px 16px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.io-industry-btn:hover { background: var(--slate-50); color: var(--blue-700); }
.io-industry-btn.active {
  background: var(--blue-50);
  color: var(--blue-700);
  font-weight: 600;
}

.io-panel {
  display: flex;
  flex-direction: column;
  min-height: 480px;
  padding: 0 !important;
  overflow: hidden;
}
.io-tab-bar {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--slate-200);
  background: #fff;
  flex-shrink: 0;
}
.io-tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  color: var(--slate-600);
  cursor: pointer;
  padding: 4px 0;
}
.io-tab::before {
  content: '';
  width: 14px;
  height: 14px;
  border: 1.5px solid var(--slate-300, #cbd5e1);
  border-radius: 3px;
  flex-shrink: 0;
  transition: background 0.15s, border-color 0.15s;
}
.io-tab.active { color: var(--blue-700); font-weight: 600; }
.io-tab.active::before {
  background: var(--blue-600);
  border-color: var(--blue-600);
  box-shadow: inset 0 0 0 2px #fff;
}

.io-body {
  display: flex;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  background: #fff;
}
.io-empty {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--slate-400);
  font-size: 13px;
  padding: 48px 24px;
  text-align: center;
}

@media (max-width: 768px) {
  .entry-list-panel { padding: 4px 14px 16px; }
}
</style>
</head>
<body>
<header class="platform-nav-outer">
  <div class="platform-nav-inner">
    <div id="platform-nav-mount" data-active="observe"></div>
  </div>
</header>
<div class="subpage-with-nav">

  <div class="subpage-wrap">
  <header class="subpage-header">
    <h1>工业观察</h1>
    <p>聚焦机床、机器人、氢能等九大行业，汇总产业政策、行业动态与重大事件监测。</p>
  </header>

  <div class="subpage-body">
    <nav class="subpage-sidebar io-sidebar" id="industryNav" aria-label="产业政策行业目录">
      <div class="sidebar-heading">产业政策</div>
      <ul class="io-industry-list" id="industryList"></ul>
    </nav>

    <main class="subpage-content io-panel" id="mainPanel" aria-live="polite">
      <div class="io-tab-bar" role="tablist" aria-label="内容类型筛选">
        <button type="button" class="io-tab" role="tab" data-tab="industry">行业动态</button>
        <button type="button" class="io-tab" role="tab" data-tab="policy">政策</button>
        <button type="button" class="io-tab" role="tab" data-tab="event">重大事件监测</button>
      </div>
      <div class="io-body" id="ioBody"></div>
    </main>
  </div>

  <footer class="subpage-footer">京城机电产业研究与市场分析平台 · 工业观察</footer>
  </div>
</div>
<div class="report-toast" id="io-toast" role="status" aria-live="polite"></div>

<script src="../assets/subpage-nav.js"></script>
<script src="../assets/demo-data.js"></script>
<script src="../assets/industrial-observation-data.js"></script>
<script src="../assets/jc35-industry-patch.js"></script>
<script>
(function () {
  var DATA = (window.DEMO_DATA && window.DEMO_DATA.industrialObservation) || [];

  var INDUSTRIES = [
    '机床', '机器人', '液压', '氢能及气体储运装备',
    '能源', '印刷', '环保', '增材制造', '其他'
  ];

  var TABS = [
    { id: 'industry', label: '行业动态', prefix: '行业动态' },
    { id: 'policy', label: '政策', prefix: '政策解读' },
    { id: 'event', label: '重大事件监测', prefix: '重大事件' }
  ];

  var TYPE_PREFIX = { policy: '政策解读', industry: '行业动态', event: '重大事件' };

  var state = { industry: '机床', tab: 'policy' };

  var industryListEl = document.getElementById('industryList');
  var ioBodyEl = document.getElementById('ioBody');
  var tabBarEl = document.querySelector('.io-tab-bar');
  var toastEl = document.getElementById('io-toast');
  var toastTimer;

  function esc(s) {
    if (!s) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function showToast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('is-show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('is-show');
    }, 2200);
  }

  function formatEntryDate(dateStr) {
    if (!dateStr) return '—';
    var s = String(dateStr);
    if (s.length >= 7 && s.indexOf('-') >= 0) return s.slice(0, 7);
    return s;
  }

  function renderEntryLink(item) {
    var text = item.title;
    if (item.url) {
      return '<a class="entry-link" href="' + esc(item.url) + '" target="_blank" rel="noopener">' + esc(text) + '</a>';
    }
    return '<button type="button" class="entry-link entry-link-btn" data-id="' + item.id + '">' + esc(text) + '</button>';
  }

  function renderEntryItem(item) {
    return '<article class="entry-item" id="io-item-' + item.id + '">' +
      '<div class="entry-head"><strong class="entry-title">' + esc(item.title) + '</strong>' +
      '<span class="entry-dot"> · </span><span class="entry-date">' + esc(formatEntryDate(item.date)) + '</span></div>' +
      '<p class="entry-summary">' + esc(item.summary || item.content || '—') + '</p>' +
      renderEntryLink(item) +
    '</article>';
  }

  function filterItems() {
    return DATA.filter(function (it) {
      return it.industry === state.industry && it.type === state.tab;
    });
  }

  function renderIndustryNav() {
    industryListEl.innerHTML = INDUSTRIES.map(function (name) {
      var cls = name === state.industry ? 'io-industry-btn active' : 'io-industry-btn';
      return '<li><button type="button" class="' + cls + '" data-industry="' + esc(name) + '">' + esc(name) + '</button></li>';
    }).join('');
  }

  function renderTabs() {
    tabBarEl.querySelectorAll('.io-tab').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.tab === state.tab);
      btn.setAttribute('aria-selected', btn.dataset.tab === state.tab ? 'true' : 'false');
    });
  }

  function renderBody() {
    var items = filterItems();
    if (!items.length) {
      ioBodyEl.innerHTML = '<div class="io-empty">当前行业「' + esc(state.industry) + '」下暂无「' +
        esc(TABS.find(function (t) { return t.id === state.tab; }).label) + '」类数据</div>';
      return;
    }

    ioBodyEl.innerHTML = '<div class="entry-list-panel"><div class="entry-list">' +
      items.map(renderEntryItem).join('') +
      '</div></div>';

    ioBodyEl.querySelectorAll('.entry-link-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        showToast('未上传');
      });
    });
  }

  function scrollToItem(id) {
    var el = document.getElementById('io-item-' + id);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      el.classList.add('is-flash');
      setTimeout(function () { el.classList.remove('is-flash'); }, 1200);
    }
  }

  function updateUrl() {
    var params = new URLSearchParams();
    params.set('industry', state.industry);
    params.set('tab', state.tab);
    history.replaceState(null, '', '?' + params.toString());
  }

  function applyState() {
    renderIndustryNav();
    renderTabs();
    renderBody();
    updateUrl();
  }

  function selectIndustry(name) {
    state.industry = name;
    applyState();
  }

  function selectTab(tabId) {
    state.tab = tabId;
    applyState();
  }

  industryListEl.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-industry]');
    if (btn) selectIndustry(btn.dataset.industry);
  });

  tabBarEl.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-tab]');
    if (btn) selectTab(btn.dataset.tab);
  });

  function normalizeTab(raw) {
    if (!raw) return 'policy';
    var m = {
      policy: 'policy', policies: 'policy',
      industry: 'industry', enterprise: 'industry',
      event: 'event', events: 'event'
    };
    return m[raw] || 'policy';
  }

  var params = new URLSearchParams(window.location.search);
  var ind = params.get('industry');
  var tab = params.get('tab');
  var item = params.get('item');

  if (ind && INDUSTRIES.indexOf(ind) >= 0) state.industry = ind;
  state.tab = normalizeTab(tab);
  applyState();
  if (item) {
    var num = parseInt(item, 10);
    if (!isNaN(num)) setTimeout(function () { scrollToItem(num); }, 120);
  }
})();
</script>
</body>
</html>
