<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>京城机电产业研究与市场分析平台</title>
<link rel="stylesheet" href="assets/subpage-nav.css">
<style>
:root{
  --blue-900:#0c2d6b;--blue-800:#13408f;--blue-700:#1a56b5;
  --blue-600:#2563eb;--blue-500:#3b82f6;--blue-400:#60a5fa;
  --blue-100:#dbeafe;--blue-50:#eff6ff;
  --cyan:#06b6d4;--cyan-dark:#0891b2;
  --slate-900:#0f172a;--slate-700:#334155;--slate-600:#475569;
  --slate-500:#64748b;--slate-400:#94a3b8;--slate-300:#cbd5e1;
  --slate-200:#e2e8f0;--slate-100:#f1f5f9;--slate-50:#f8fafc;
  --border:#d9e2ef;--shadow:0 1px 4px rgba(15,45,107,.06);
  --radius:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.6;color:var(--slate-600);background:var(--slate-50);
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.site{max-width:1480px;margin:0 auto;padding:0 12px 48px}

/* ===== Header ===== */
.site-header{
  position:relative;margin:0 -12px 0;padding:36px 24px 28px;
  background:linear-gradient(135deg,#0a2558 0%,#13408f 45%,#1a56b5 100%);
  overflow:hidden;text-align:center;
}
.site-header::before{
  content:"";position:absolute;inset:0;opacity:.18;
  background:
    radial-gradient(circle at 20% 60%,rgba(96,165,250,.6) 0%,transparent 50%),
    radial-gradient(circle at 80% 30%,rgba(6,182,212,.4) 0%,transparent 45%),
    repeating-linear-gradient(45deg,transparent,transparent 20px,rgba(255,255,255,.03) 20px,rgba(255,255,255,.03) 21px);
  pointer-events:none;
}
.header-inner{position:relative;z-index:1}
.header-title{
  font-size:clamp(22px,4vw,32px);font-weight:700;color:#fff;
  letter-spacing:2px;text-shadow:0 2px 8px rgba(0,0,0,.25);margin-bottom:8px;
}

/* ===== Ticker ===== */
.ticker-bar{
  display:flex;align-items:center;gap:12px;
  background:var(--blue-50);border-bottom:1px solid var(--blue-100);
  padding:8px 16px;margin:0 -12px 20px;font-size:13px;
}
.ticker-label{
  flex-shrink:0;display:flex;align-items:center;gap:6px;
  font-weight:700;color:var(--blue-700);white-space:nowrap;
}
.ticker-icon{
  width:18px;height:18px;background:var(--blue-600);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.ticker-icon svg{width:10px;height:10px;fill:#fff}
.ticker-track{flex:1;overflow:hidden;white-space:nowrap}
.ticker-text{
  display:inline-block;color:var(--slate-600);
  animation:ticker 28s linear infinite;
}
.ticker-text a{color:inherit;transition:color .15s}
.ticker-text a:hover{color:var(--blue-600);cursor:pointer}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* ===== Layer sections ===== */
.layer{margin-bottom:20px}
.layer-bottom{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch;
}
.trend-column{min-width:0;display:flex;flex-direction:column;gap:10px}
.trend-column .chart-panel{flex:1;min-height:380px}

/* ===== Section titles ===== */
.sec-head{
  display:flex;align-items:center;gap:8px;margin-bottom:12px;
  font-size:15px;font-weight:700;color:var(--blue-800);
}
.sec-head .icon{
  width:16px;height:16px;background:var(--blue-600);border-radius:2px;flex-shrink:0;
}
.sec-head .icon.diamond{
  background:transparent;width:14px;height:14px;
  border:2px solid var(--blue-500);transform:rotate(45deg);border-radius:1px;
}

/* ===== Clickable module overlay ===== */
.module-link{
  display:block;color:inherit;cursor:pointer;
  transition:box-shadow .2s,transform .2s;
}
.module-link:hover{box-shadow:0 4px 20px rgba(37,99,235,.12)}
.module-link:focus-visible{outline:2px solid var(--blue-600);outline-offset:2px}

/* ===== Layer 1: 工业观察 ===== */
.observe-panel{
  border:1px solid var(--border);border-radius:var(--radius);background:#fff;
  box-shadow:var(--shadow);padding:16px 18px;
}
.observe-panel .panel-head-row{margin-bottom:14px}
.observe-panel .goto-badge{color:inherit}
.layer-observe{
  display:grid;grid-template-columns:1fr 1fr;gap:16px;
}
.visual-block{
  position:relative;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
  min-height:300px;background:var(--slate-900);
}
.visual-block img{width:100%;height:100%;object-fit:cover;display:block;min-height:300px}
.visual-overlay{
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(10,37,88,.75) 0%,rgba(26,86,181,.45) 100%);
  display:flex;flex-direction:column;justify-content:flex-end;padding:20px;
}
.visual-tag{
  font-size:11px;font-weight:600;color:rgba(255,255,255,.75);
  letter-spacing:1px;margin-bottom:4px;
}
.visual-title{font-size:18px;font-weight:700;color:#fff;line-height:1.4}
.visual-enter{
  margin-top:10px;font-size:12px;font-weight:600;color:var(--cyan);
  display:inline-flex;align-items:center;gap:4px;
}

.news-panel{
  border:1px solid var(--border);border-radius:var(--radius);background:#fff;
  box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;
}
.news-tabs{
  display:flex;border-bottom:1px solid var(--border);background:var(--slate-50);
}
.news-tab{
  flex:1;appearance:none;border:none;background:transparent;
  padding:10px 8px;font-size:13px;font-weight:600;color:var(--slate-500);
  border-bottom:2px solid transparent;transition:all .15s;
}
.news-tab:hover{color:var(--blue-600)}
.news-tab[aria-selected="true"]{
  color:#fff;background:var(--blue-700);border-bottom-color:var(--blue-700);
}
.news-list{flex:1;padding:4px 0}
.news-panel-link{
  display:block;text-align:center;padding:10px;font-size:12px;font-weight:600;
  color:var(--blue-600);border-top:1px solid var(--border);background:var(--slate-50);
  transition:background .15s;
}
.news-panel-link:hover{background:var(--blue-50)}
.news-item{
  display:flex;align-items:flex-start;gap:8px;padding:10px 14px;
  border-bottom:1px dashed var(--slate-200);font-size:13px;line-height:1.5;
  color:inherit;text-decoration:none;transition:color .15s,background .15s;
}
.news-item:last-child{border-bottom:none}
.news-item:hover{cursor:pointer;background:var(--blue-50)}
.news-item:hover .news-title{color:var(--blue-600)}
.news-tag{
  flex-shrink:0;font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;
  margin-top:2px;
}
.tag-h2{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
.tag-jc{background:#fefce8;color:#a16207;border:1px solid #fde68a}
.tag-wl{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.tag-sz{background:#ecfeff;color:#0e7490;border:1px solid #a5f3fc}
.tag-ny{background:var(--blue-50);color:var(--blue-700);border:1px solid var(--blue-100)}
.tag-qy{background:#f5f3ff;color:#6d28d9;border:1px solid #ddd6fe}
.news-title{
  flex:1;color:var(--slate-700);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

/* ===== Layer 2: 主题报告 ===== */
.reports-section{
  border:1px solid var(--border);border-radius:var(--radius);background:#fff;
  box-shadow:var(--shadow);padding:16px 18px;
}
.reports-section .panel-head-row{margin-bottom:12px}
.reports-section .report-upload-btn{flex-shrink:0}
.report-upload-btn{
  appearance:none;border:1px solid var(--blue-200);background:var(--blue-50);
  color:var(--blue-700);font-size:12px;font-weight:600;padding:6px 14px;
  border-radius:6px;cursor:pointer;transition:background .15s,border-color .15s;
}
.report-upload-btn:hover{background:var(--blue-100);border-color:var(--blue-300)}
.reports-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:0 32px;
}
.report-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 0;border-bottom:1px dashed var(--slate-200);font-size:13px;
  cursor:pointer;border-radius:4px;margin:0 -6px;padding-left:6px;padding-right:6px;
  transition:background .15s,color .15s;
}
.report-row:hover{background:var(--blue-50)}
.report-row.has-article:hover .report-title{color:var(--blue-700)}
.report-row.no-article:hover .report-title{color:var(--slate-500)}
.report-row:last-child,.reports-grid .report-row:nth-last-child(2):nth-child(odd){border-bottom:none}
.report-title{
  flex:1;color:var(--slate-700);min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.report-title::before{content:"◆ ";color:var(--blue-400);font-size:10px}
.report-meta{display:flex;align-items:center;gap:6px;flex-shrink:0}
.report-tag{
  font-size:11px;color:var(--slate-600);
  background:var(--slate-100);border:1px solid var(--slate-200);
  padding:2px 8px;border-radius:3px;white-space:nowrap;
}
.report-tag.date{font-family:Consolas,monospace;color:var(--blue-700);background:var(--blue-50);border-color:var(--blue-100)}
.report-toast{
  position:fixed;left:50%;bottom:32px;transform:translateX(-50%);
  background:var(--slate-800);color:#fff;font-size:13px;padding:10px 18px;
  border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.2);z-index:9999;
  pointer-events:none;opacity:0;transition:opacity .2s;
}
.report-toast.is-show{opacity:1}

/* ===== Layer 3: 趋势 + 竞争 ===== */
.chart-panel,.compete-panel{
  min-width:0;border:1px solid var(--border);border-radius:var(--radius);background:#fff;
  box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;min-height:420px;
  transition:box-shadow .2s;
}
.panel-head-row{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;
}
.panel-head-row .sec-head{margin-bottom:0}
.goto-badge{
  font-size:11px;font-weight:600;color:var(--blue-600);
  padding:3px 10px;border-radius:4px;background:var(--blue-50);border:1px solid var(--blue-100);
}
.sample-badge{
  font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px;
  background:var(--slate-100);color:var(--slate-500);border:1px solid var(--slate-200);
}

/* ===== 行业趋势 · 美化 ===== */
.trend-tabs{
  display:inline-flex;gap:4px;margin-bottom:14px;padding:3px;
  background:var(--slate-100);border-radius:8px;
}
.trend-tab{
  appearance:none;border:none;background:transparent;
  padding:7px 18px;font-size:13px;font-weight:600;color:var(--slate-500);
  border-radius:6px;transition:all .2s;
}
.trend-tab:hover{color:var(--blue-600);background:rgba(255,255,255,.6)}
.trend-tab[aria-selected="true"]{
  color:#fff;background:linear-gradient(135deg,var(--blue-700),var(--blue-600));
  box-shadow:0 2px 8px rgba(37,99,235,.25);
}

.trend-kpi-row{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;
}
.trend-kpi{
  position:relative;background:linear-gradient(135deg,#fff 0%,var(--blue-50) 100%);
  border:1px solid var(--blue-100);border-radius:8px;
  padding:12px 14px;overflow:hidden;
  transition:transform .2s,box-shadow .2s;
}
.trend-kpi::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--blue-600),var(--cyan));border-radius:3px 0 0 3px;
}
.trend-kpi:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(37,99,235,.12)}
.trend-kpi .lk{font-size:11px;color:var(--slate-500);margin-bottom:2px}
.trend-kpi .lv{font-size:20px;font-weight:700;color:var(--blue-800);line-height:1.2}
.trend-kpi .lu{font-size:10px;color:var(--slate-400);margin-top:2px}

.trend-body{display:flex;flex-direction:column;gap:12px;flex:1}
.chart-wrap{
  flex:1;background:var(--slate-50);border:1px solid var(--slate-200);
  border-radius:8px;padding:8px 4px 4px;min-height:200px;
}
.chart-wrap svg{width:100%;height:200px;display:block;min-height:200px}
.chart-legend{
  display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;padding:0 8px;
}
.chart-legend-item{
  display:flex;align-items:center;gap:5px;font-size:11px;color:var(--slate-600);
}
.chart-legend-dot{width:10px;height:3px;border-radius:2px;flex-shrink:0}

.chart-caption{
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  margin-top:4px;font-size:11px;color:var(--slate-400);line-height:1.4;
}
.chart-caption .source-text{flex:1;text-align:right}

/* ===== 竞争分析 ===== */
.compete-ticker{
  background:var(--blue-50);border:1px solid var(--blue-100);border-radius:6px;
  padding:7px 12px;font-size:12px;color:var(--blue-700);margin-bottom:12px;
  overflow:hidden;white-space:nowrap;
}
.compete-ticker span{display:inline-block;animation:ticker 18s linear infinite}
.compete-tabs{margin-bottom:10px}
.compete-table-wrap{flex:1;min-width:0;overflow-x:auto;border-radius:8px;border:1px solid var(--slate-200)}
.compete-table{width:100%;min-width:640px;border-collapse:collapse;font-size:12px}
.compete-table thead th{
  background:linear-gradient(180deg,var(--blue-700),var(--blue-800));color:#fff;font-weight:600;
  padding:9px 10px;text-align:left;white-space:nowrap;
}
.compete-table tbody td{
  padding:8px 10px;border-bottom:1px solid var(--slate-200);color:var(--slate-700);
  max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.compete-table tbody tr:nth-child(even) td{background:var(--slate-50)}
.compete-table tbody tr:hover td{background:var(--blue-50)}
.compete-note{
  margin-top:10px;font-size:11px;color:var(--slate-400);
  padding:6px 10px;border:1px dashed var(--slate-200);border-radius:6px;text-align:center;
}

/* Clickable panels */
.clickable-panel{cursor:pointer;position:relative}
.clickable-panel .no-navigate{position:relative;z-index:2}
.clickable-panel::after{content:"";position:absolute;inset:0;z-index:1}
.clickable-panel:hover{box-shadow:0 4px 20px rgba(37,99,235,.1)}

.site-footer{margin-top:32px;text-align:center;font-size:12px;color:var(--slate-400)}

/* ===== Responsive ===== */
@media(max-width:900px){
  .layer-observe,.layer-bottom,.reports-grid{grid-template-columns:1fr}
  .reports-grid .report-row:nth-last-child(2):nth-child(odd){border-bottom:1px dashed var(--slate-200)}
}
@media(max-width:520px){
  .trend-kpi-row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="platform-nav-outer">
  <div class="platform-nav-inner">
    <div id="platform-nav-mount" data-active="home"></div>
  </div>
</header>
<div class="site">

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <h1 class="header-title">京城机电产业研究与市场分析平台</h1>
      <p style="color:rgba(255,255,255,0.75);font-size:13px;letter-spacing:1px">产业研究 · 市场分析 · 竞争洞察 · 政策监测</p>
    </div>
  </header>

  <!-- Ticker -->
  <div class="ticker-bar">
    <div class="ticker-label">
      <span class="ticker-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      </span>
      最新政策
    </div>
    <div class="ticker-track">
      <span class="ticker-text" id="policy-ticker"></span>
    </div>
  </div>

  <!-- 【上层 · 全宽】工业观察 -->
  <section class="layer observe-panel" aria-label="工业观察">
    <div class="panel-head-row">
      <div class="sec-head"><span class="icon" aria-hidden="true"></span>工业观察</div>
      <a class="goto-badge" href="pages/工业观察看板.html?industry=%E6%9C%BA%E5%BA%8A&amp;tab=policy">点击查看详情</a>
    </div>
    <div class="layer-observe">
    <a class="visual-block module-link" href="pages/工业观察看板.html?industry=%E6%9C%BA%E5%BA%8A&amp;tab=policy" aria-label="进入工业观察看板">
      <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="300" viewBox="0 0 600 300" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0a2558"/>
            <stop offset="100%" stop-color="#1a56b5"/>
          </linearGradient>
          <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#f59e0b" stop-opacity=".6"/>
            <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect width="600" height="300" fill="url(#bg)"/>
        <circle cx="300" cy="150" r="90" fill="url(#glow)"/>
        <circle cx="300" cy="150" r="60" fill="none" stroke="#60a5fa" stroke-width="2" opacity=".5"/>
        <circle cx="300" cy="150" r="80" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="6 4" opacity=".4"/>
        <path d="M240 150 L300 110 L360 150 L300 190 Z" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity=".6"/>
        <line x1="120" y1="150" x2="480" y2="150" stroke="#3b82f6" stroke-width=".5" opacity=".3"/>
        <line x1="300" y1="50" x2="300" y2="250" stroke="#3b82f6" stroke-width=".5" opacity=".3"/>
      </svg>
      <div class="visual-overlay">
        <div class="visual-tag">政策 · 动态 · 事件</div>
        <div class="visual-title">产业政策解读 · 行业动态 · 重大事件监测</div>
        <span class="visual-enter">进入工业观察看板 →</span>
      </div>
    </a>

    <div class="news-panel">
      <div class="news-tabs" role="tablist" aria-label="工业观察分类">
        <button type="button" class="news-tab" role="tab" data-panel="policy" aria-selected="true">热门政策</button>
        <button type="button" class="news-tab" role="tab" data-panel="industry" aria-selected="false">产业动态</button>
        <button type="button" class="news-tab" role="tab" data-panel="enterprise" aria-selected="false">企业动态</button>
      </div>
      <div class="news-list" id="news-list"></div>
      <a class="news-panel-link" id="news-panel-link" href="pages/工业观察看板.html?industry=%E6%9C%BA%E5%BA%8A&amp;tab=policy">进入工业观察看板 →</a>
    </div>
    </div>
  </section>

  <!-- 【中层 · 全宽】主题报告 -->
  <section class="layer layer-report" aria-label="主题报告">
    <div class="reports-section" aria-label="主题报告">
      <div class="panel-head-row">
        <div class="sec-head"><span class="icon diamond" aria-hidden="true"></span>主题报告</div>
        <button type="button" class="report-upload-btn" id="report-upload-btn">上传文档</button>
        <input type="file" id="report-upload-input" hidden accept=".pdf,.doc,.docx,.html,.htm,.md">
      </div>
      <div class="reports-grid" id="reports-grid"></div>
    </div>
    <div class="report-toast" id="report-toast" role="status" aria-live="polite"></div>
  </section>

  <!-- 【底层 · 50/50】行业趋势 + 竞争分析 -->
  <section class="layer layer-bottom" aria-label="行业趋势与竞争分析">

    <!-- 左：行业趋势 -->
    <div class="trend-column">
    <div class="chart-panel clickable-panel" data-href="pages/行业趋势.html?industry=robot&amp;view=finance" tabindex="0" role="link" aria-label="行业趋势，点击进入详情">
      <div class="panel-head-row">
        <div class="sec-head"><span class="icon" aria-hidden="true"></span>行业趋势</div>
        <span class="goto-badge">点击查看详情</span>
      </div>
      <div class="trend-tabs no-navigate" role="tablist" aria-label="行业选择">
        <button type="button" class="trend-tab" role="tab" data-key="robot" aria-selected="true">工业机器人</button>
        <button type="button" class="trend-tab" role="tab" data-key="machine" aria-selected="false">机床</button>
      </div>
      <div class="no-navigate trend-body" id="trend-content">

<script>
(function initIndexPage(){
  var D = window.DEMO_DATA || {};
  var IO = D.industrialObservation || [];

  var PANEL_TAB_MAP = { policy: 'policy', industry: 'industry', enterprise: 'event' };
  var INDUSTRY_TAG = {
    '机床': { label: '机床', cls: 'tag-jc' },
    '机器人': { label: '机器人', cls: 'tag-ny' },
    '氢能及气体储运装备': { label: '氢能', cls: 'tag-h2' },
    '氢能': { label: '氢能', cls: 'tag-h2' }
  };

  function esc(s){
    if(!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function ioBoardHref(industry, tab, itemId){
    return 'pages/工业观察看板.html?industry=' + encodeURIComponent(industry) +
      '&tab=' + tab + '&item=' + itemId;
  }

  function resolveArticleLink(it, industry, tab, itemId){
    if(it && it.url){
      return { href: it.url, external: true };
    }
    return {
      href: ioBoardHref(industry || (it && it.industry) || '机床', tab, itemId || (it && it.id)),
      external: false
    };
  }

  function externalLinkAttrs(external){
    return external ? ' target="_blank" rel="noopener"' : '';
  }

  function industryTag(industry){
    return INDUSTRY_TAG[industry] || { label: industry || '机床', cls: 'tag-jc' };
  }

  function buildNewsFromIO(panelKey){
    var type = PANEL_TAB_MAP[panelKey] || 'policy';
    return IO.filter(function(it){ return it.type === type; })
      .sort(function(a,b){
        var d = String(b.date).localeCompare(String(a.date));
        if (d !== 0) return d;
        return (b.id || 0) - (a.id || 0);
      })
      .slice(0, 5)
      .map(function(it){
        var tag = industryTag(it.industry);
        var link = resolveArticleLink(it, it.industry, type, it.id);
        return {
          tag: tag.label,
          cls: tag.cls,
          title: it.title,
          href: link.href,
          external: link.external
        };
      });
  }

  function buildNewsFallback(panelKey){
    return (D.news && D.news[panelKey]) ? D.news[panelKey].map(function(it, idx){
      var type = PANEL_TAB_MAP[panelKey] || 'policy';
      var industry = { '机床': '机床', '机器人': '机器人', '氢能': '氢能及气体储运装备' }[it.tag] || '机床';
      var link = resolveArticleLink(it, industry, type, idx + 1);
      return {
        tag: it.tag,
        cls: it.cls,
        title: it.title,
        href: link.href,
        external: link.external
      };
    }) : [];
  }

  /* ===== 1. 最新政策 ticker ===== */
  function renderTicker(){
    var tickerEl = document.getElementById('policy-ticker');
    if(!tickerEl) return;

    var items = [];
    if(D.ticker && D.ticker.length){
      items = D.ticker.map(function(t){
        return { title: t.title, href: t.url, external: true };
      });
    } else {
      items = IO.filter(function(it){ return it.type === 'policy'; })
        .sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); })
        .slice(0, 5)
        .map(function(it){
          var link = resolveArticleLink(it, it.industry, 'policy', it.id);
          return { title: it.title, href: link.href, external: link.external };
        });
    }

    if(!items.length) return;

    var sep = ' &nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp; ';
    var html = items.map(function(t){
      return '<a href="'+esc(t.href)+'"'+externalLinkAttrs(t.external)+'>'+esc(t.title)+'</a>';
    }).join(sep);
    tickerEl.innerHTML = html + sep + html;
  }

  /* ===== 2. 工业观察页签列表 ===== */
  var newsListEl = document.getElementById('news-list');
  var newsTabs = document.querySelectorAll('.news-tab');
  var newsPanelLink = document.getElementById('news-panel-link');
  var activeNewsPanel = 'policy';

  function renderNews(key){
    activeNewsPanel = key;
    var items = IO.length ? buildNewsFromIO(key) : buildNewsFallback(key);
    if(!newsListEl) return;

    newsListEl.innerHTML = items.map(function(it){
      return '<a class="news-item" href="'+esc(it.href)+'"'+externalLinkAttrs(it.external)+'>' +
        '<span class="news-tag '+esc(it.cls)+'">'+esc(it.tag)+'</span>' +
        '<span class="news-title">'+esc(it.title)+'</span></a>';
    }).join('');

    if(newsPanelLink){
      var tab = PANEL_TAB_MAP[key] || 'policy';
      newsPanelLink.href = 'pages/工业观察看板.html?industry=' + encodeURIComponent('机床') + '&tab=' + tab;
    }
  }

  newsTabs.forEach(function(tab){
    tab.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      newsTabs.forEach(function(t){ t.setAttribute('aria-selected', t === tab ? 'true' : 'false'); });
      renderNews(tab.dataset.panel);
    });
  });
  renderNews('policy');

  var visualBlock = document.querySelector('.visual-block');
  if(visualBlock){
    var latestPolicy = IO.filter(function(it){ return it.type === 'policy'; })
      .sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); })[0];
    if(latestPolicy){
      var policyLink = resolveArticleLink(latestPolicy, latestPolicy.industry, 'policy', latestPolicy.id);
      visualBlock.href = policyLink.href;
      if(policyLink.external){
        visualBlock.target = '_blank';
        visualBlock.rel = 'noopener';
      } else {
        visualBlock.removeAttribute('target');
        visualBlock.removeAttribute('rel');
      }
    }
  }

  /* ===== 3. 主题报告（首页预览） ===== */
  var reportToastTimer;
  function showReportToast(msg){
    var toast = document.getElementById('report-toast');
    if(!toast) return;
    toast.textContent = msg;
    toast.classList.add('is-show');
    clearTimeout(reportToastTimer);
    reportToastTimer = setTimeout(function(){
      toast.classList.remove('is-show');
    }, 2200);
  }

  function resolveReportHref(url){
    if(!url || !String(url).trim()) return '';
    var href = String(url).trim();
    if(/^https?:\/\//i.test(href)) return href;
    if(href.indexOf('pages/') === 0) return href;
    if(href.indexOf('../') === 0) return href.replace(/^\.\.\//, '');
    return href;
  }

  function renderRecommendedReports(){
    var grid = document.getElementById('reports-grid');
    var reports = D.recommendedReports || [];
    if(!grid || !reports.length) return;

    grid.innerHTML = reports.map(function(r){
      var hasUrl = !!(r.url && String(r.url).trim());
      return '<div class="report-row ' + (hasUrl ? 'has-article' : 'no-article') + '" data-id="' + r.id + '" tabindex="0" role="button" aria-label="' + esc(r.title) + (hasUrl ? '，点击查看' : '，未上传') + '">' +
        '<span class="report-title">'+esc(r.title)+'</span>' +
        '<span class="report-meta">' +
          '<span class="report-tag">'+esc(r.author || '—')+'</span>' +
          '<span class="report-tag date">'+esc(r.date)+'</span>' +
        '</span></div>';
    }).join('');

    grid.querySelectorAll('.report-row').forEach(function(row){
      function activate(){
        var id = row.dataset.id;
        var report = null;
        for(var i = 0; i < reports.length; i++){
          if(String(reports[i].id) === String(id)){ report = reports[i]; break; }
        }
        var href = resolveReportHref(report && report.url);
        if(href){
          window.location.href = href;
        } else {
          showReportToast('未上传');
        }
      }
      row.addEventListener('click', activate);
      row.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          activate();
        }
      });
    });
  }
  renderRecommendedReports();

  var uploadBtn = document.getElementById('report-upload-btn');
  var uploadInput = document.getElementById('report-upload-input');
  if(uploadBtn && uploadInput){
    uploadBtn.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      uploadInput.click();
    });
    uploadInput.addEventListener('change', function(){
      if(!uploadInput.files || !uploadInput.files.length) return;
      var name = uploadInput.files[0].name;
      showReportToast('「' + name + '」上传功能暂未开放');
      uploadInput.value = '';
    });
  }

  /* ===== 4. 行业趋势 ===== */
  var TREND_DATA = D.trends || {};
  var trendTabs = document.querySelectorAll('.chart-panel .trend-tabs .trend-tab');
  var kpiEl = document.getElementById('trend-kpis');
  var chartEl = document.getElementById('trend-chart');
  var legendEl = document.getElementById('chart-legend');
  var chartTitleEl = document.getElementById('chart-title');
  var trendsPanel = document.querySelector('.chart-panel.clickable-panel');
  var activeTrendKey = 'robot';

  function trendHref(key){
    return 'pages/行业趋势.html?industry=' + (key || activeTrendKey) + '&view=finance';
  }

  function scaleY(val, maxVal, top, bottom){
    return bottom - (val / maxVal) * (bottom - top);
  }

  function renderKpis(kpis){
    if(!kpiEl) return;
    kpiEl.innerHTML = kpis.map(function(k){
      return '<div class="trend-kpi"><div class="lk">'+esc(k.label)+'</div>' +
        '<div class="lv">'+esc(k.value)+'</div><div class="lu">'+esc(k.unit)+'</div></div>';
    }).join('');
  }

  function renderBarChart(years, series, opts){
    opts = opts || {};
    var W = 480, H = 200, padL = 40, padR = 12, padT = 22, padB = 28;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var plotBottom = padT + plotH;
    var vals = series.values.slice(0, years.length);
    var maxVal = Math.max.apply(null, vals) * 1.15 || 1;
    var n = years.length;
    var gap = 4;
    var barW = Math.max(8, (plotW - gap * (n - 1)) / n);
    var highlightYear = opts.highlightYear || '';
    var forecastFrom = typeof opts.forecastFrom === 'number' ? opts.forecastFrom : -1;
    var baseColor = series.color || '#64748b';
    var hiColor = series.highlightColor || '#dc2626';
    var fcColor = series.forecastColor || '#93c5fd';

    var gridLines = '';
    for(var g = 0; g <= 4; g++){
      var gy = padT + (g / 4) * plotH;
      gridLines += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(padL+plotW)+'" y2="'+gy+'" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>';
    }

    var axisY = '';
    for(var a = 0; a <= 4; a++){
      var aval = maxVal * (4 - a) / 4;
      var avalText = aval >= 100 ? String(Math.round(aval)) : (Math.round(aval * 10) / 10);
      var ay = padT + (a / 4) * plotH + 3;
      axisY += '<text x="'+(padL-6)+'" y="'+ay+'" font-size="9" fill="#64748b" text-anchor="end">'+avalText+'</text>';
    }

    var bars = '';
    var labels = '';
    years.forEach(function(y, i){
      if(i >= vals.length) return;
      var v = vals[i];
      var x = padL + i * (barW + gap);
      var bh = (v / maxVal) * plotH;
      var yTop = plotBottom - bh;
      var fill = i >= forecastFrom ? fcColor : (y === highlightYear ? hiColor : baseColor);
      var opacity = i >= forecastFrom ? '0.85' : '1';
      bars += '<rect x="'+x+'" y="'+yTop+'" width="'+barW+'" height="'+bh+'" rx="2" fill="'+fill+'" opacity="'+opacity+'"/>';
      var tip = v >= 100 ? String(Math.round(v)) : String(v);
      if(parseFloat(tip) >= 10 || v >= 1){
        bars += '<text x="'+(x + barW/2)+'" y="'+(yTop - 4)+'" font-size="8" fill="#475569" text-anchor="middle">'+tip+'</text>';
      }
      var lx = x + barW / 2;
      var label = y.length > 4 ? y.replace('20','') : y;
      labels += '<text x="'+lx+'" y="'+(H-6)+'" font-size="9" fill="#64748b" text-anchor="middle" font-weight="500">'+label+'</text>';
    });

    var axisTitle = '<text x="'+padL+'" y="'+(padT-6)+'" font-size="9" fill="#475569" font-weight="600">'+esc(series.name)+'</text>';

    return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">' +
      gridLines +
      '<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+plotBottom+'" stroke="#94a3b8" stroke-width="1"/>' +
      '<line x1="'+padL+'" y1="'+plotBottom+'" x2="'+(padL+plotW)+'" y2="'+plotBottom+'" stroke="#cbd5e1" stroke-width="1"/>' +
      axisY + axisTitle + bars + labels +
      '</svg>';
  }

  function renderDualAxisChart(years, series){
    var W = 480, H = 200, padL = 44, padR = 44, padT = 24, padB = 28;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var plotBottom = padT + plotH;
    var leftSeries = series.find(function(s){ return s.yAxis === 'left'; }) || series[0];
    var rightSeries = series.find(function(s){ return s.yAxis === 'right'; }) || series[1];
    if(!leftSeries || !rightSeries) return '';

    var leftVals = leftSeries.values.slice(0, years.length);
    var rightVals = rightSeries.values.slice(0, years.length);
    var maxLeft = Math.max.apply(null, leftVals) * 1.12 || 1;
    var maxRight = Math.max.apply(null, rightVals) * 1.12 || 1;

    var areaGrad = '<linearGradient id="areaGradLeft" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="'+leftSeries.color+'" stop-opacity=".18"/>' +
      '<stop offset="100%" stop-color="'+leftSeries.color+'" stop-opacity="0"/></linearGradient>';

    var gridLines = '';
    for(var g = 0; g <= 4; g++){
      var gy = padT + (g / 4) * plotH;
      gridLines += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(padL+plotW)+'" y2="'+gy+'" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>';
    }

    var leftAxisY = '';
    for(var a = 0; a <= 4; a++){
      var lval = Math.round(maxLeft * (4 - a) / 4 * 10) / 10;
      var lay = padT + (a / 4) * plotH + 3;
      leftAxisY += '<text x="'+(padL-6)+'" y="'+lay+'" font-size="9" fill="'+leftSeries.color+'" text-anchor="end">'+lval+'</text>';
    }

    var rightAxisY = '';
    for(var b = 0; b <= 4; b++){
      var rval = Math.round(maxRight * (4 - b) / 4);
      var ray = padT + (b / 4) * plotH + 3;
      rightAxisY += '<text x="'+(padL+plotW+6)+'" y="'+ray+'" font-size="9" fill="'+rightSeries.color+'" text-anchor="start">'+rval+'%</text>';
    }

    function seriesPoints(vals, maxV){
      return vals.map(function(v, i){
        var x = padL + (years.length > 1 ? (i / (years.length - 1)) * plotW : plotW / 2);
        var y = scaleY(v, maxV, padT, plotBottom);
        return { x: x, y: y };
      });
    }

    var leftPts = seriesPoints(leftVals, maxLeft);
    var rightPts = seriesPoints(rightVals, maxRight);
    var leftPoly = leftPts.map(function(p){ return p.x+','+p.y; }).join(' ');
    var leftArea = padL+','+plotBottom+' '+leftPoly+' '+leftPts[leftPts.length-1].x+','+plotBottom;
    var leftDots = leftPts.map(function(p){
      return '<circle cx="'+p.x+'" cy="'+p.y+'" r="3.5" fill="#fff" stroke="'+leftSeries.color+'" stroke-width="2"/>';
    }).join('');
    var rightPoly = rightPts.map(function(p){ return p.x+','+p.y; }).join(' ');
    var rightDots = rightPts.map(function(p){
      return '<circle cx="'+p.x+'" cy="'+p.y+'" r="3.5" fill="#fff" stroke="'+rightSeries.color+'" stroke-width="2"/>';
    }).join('');

    var labels = years.map(function(y, i){
      var x = padL + (years.length > 1 ? (i / (years.length - 1)) * plotW : plotW / 2);
      return '<text x="'+x+'" y="'+(H-6)+'" font-size="10" fill="#64748b" text-anchor="middle" font-weight="500">'+y+'</text>';
    }).join('');

    var axisTitles =
      '<text x="'+padL+'" y="'+(padT-8)+'" font-size="9" fill="'+leftSeries.color+'" font-weight="600">'+esc(leftSeries.name.replace(/\([^)]*\)/,'').trim())+'</text>' +
      '<text x="'+(padL+plotW)+'" y="'+(padT-8)+'" font-size="9" fill="'+rightSeries.color+'" text-anchor="end" font-weight="600">国产化率</text>';

    return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">' +
      '<defs>'+areaGrad+'</defs>' +
      gridLines +
      '<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+plotBottom+'" stroke="'+leftSeries.color+'" stroke-width="1.5" opacity=".6"/>' +
      '<line x1="'+(padL+plotW)+'" y1="'+padT+'" x2="'+(padL+plotW)+'" y2="'+plotBottom+'" stroke="'+rightSeries.color+'" stroke-width="1.5" opacity=".6"/>' +
      '<line x1="'+padL+'" y1="'+plotBottom+'" x2="'+(padL+plotW)+'" y2="'+plotBottom+'" stroke="#cbd5e1" stroke-width="1"/>' +
      leftAxisY + rightAxisY + axisTitles +
      '<polygon points="'+leftArea+'" fill="url(#areaGradLeft)"/>' +
      '<polyline points="'+leftPoly+'" fill="none" stroke="'+leftSeries.color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
      leftDots +
      '<polyline points="'+rightPoly+'" fill="none" stroke="'+rightSeries.color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
      rightDots +
      labels +
      '</svg>';
  }

  function renderChartLegend(series){
    if(!legendEl) return;
    legendEl.innerHTML = series.map(function(s){
      return '<span class="chart-legend-item">' +
        '<span class="chart-legend-dot" style="background:'+s.color+'"></span>' +
        esc(s.name) + '</span>';
    }).join('');
  }

  function renderTrend(key){
    var d = TREND_DATA[key];
    if(!d) return;
    activeTrendKey = key;
    renderKpis(d.kpis);
    if(chartTitleEl) chartTitleEl.textContent = d.chartTitle || '市场规模趋势';
    if(chartEl){
      if(d.chartType === 'bar' && d.series && d.series.length === 1){
        chartEl.innerHTML = renderBarChart(d.years, d.series[0], d);
      } else {
        chartEl.innerHTML = renderDualAxisChart(d.years, d.series);
      }
    }
    renderChartLegend(d.series);
    var srcEl = document.getElementById('chart-source');
    if(srcEl) srcEl.textContent = d.source ? '数据来源：' + d.source : '';
    if(trendsPanel) trendsPanel.dataset.href = trendHref(key);
  }

  trendTabs.forEach(function(tab){
    tab.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      trendTabs.forEach(function(t){ t.setAttribute('aria-selected', t === tab ? 'true' : 'false'); });
      renderTrend(tab.dataset.key);
    });
  });
  renderTrend('robot');

  bindClickablePanel(trendsPanel);

  /* ===== 5. 竞争分析 ===== */
  var COMPETE_INDUSTRY = window.COMPETE_BY_INDUSTRY || {};
  var activeCompeteKey = 'robot';
  var competeTabs = document.querySelectorAll('.compete-tab');
  var competeNoteEl = document.getElementById('compete-note');

  function renderCompeteTable(key){
    var ctBody = document.getElementById('compete-table-body');
    if(!ctBody) return;
    var block = COMPETE_INDUSTRY[key];
    var preview = block && block.homepage ? block.homepage : null;
    var rows = preview ? preview.companies : (block && block.companies ? block.companies : []);
    var cols = preview
      ? preview.tableColumns
      : ['公司名称', '企业规模', '授权专利', '亮点'];
    var theadRow = document.querySelector('.compete-table thead tr');
    if(theadRow){
      theadRow.innerHTML = cols.map(function(h){ return '<th>' + esc(h) + '</th>'; }).join('');
    }

    ctBody.innerHTML = rows.map(function(c){
      var cells;
      if(preview){
        var fields = preview.tableFields || ['name', 'revenue', 'share', 'shipment', 'rank'];
        cells = fields.map(function(f){
          return f === 'name' ? c.name : (c[f] != null ? c[f] : '—');
        });
      } else {
        cells = [c.name, c.scale || '—', c.patents || '—', c.highlight || '—'];
      }
      var companyId = c.id || '';
      var hasProfile = /^robot-/.test(companyId) || /^comp-\d+$/.test(companyId);
      return '<tr data-company="'+esc(companyId)+'" data-industry="'+esc(key)+'" data-has-profile="'+(hasProfile?'1':'0')+'" style="cursor:pointer">' +
        cells.map(function(v){ return '<td>' + esc(v || '—') + '</td>'; }).join('') +
        '</tr>';
    }).join('');

    ctBody.querySelectorAll('tr[data-company]').forEach(function(tr){
      tr.addEventListener('click', function(e){
        e.stopPropagation();
        var industry = tr.dataset.industry || key;
        var company = tr.dataset.company;
        var href = 'pages/竞争分析看板_v4.5.html?industry=' + encodeURIComponent(industry);
        if(tr.dataset.hasProfile === '1' && company){
          href += '&company=' + encodeURIComponent(company);
        }
        window.location.href = href;
      });
    });
  }

  function renderCompeteTicker(key){
    var ctTicker = document.getElementById('compete-ticker-text');
    var block = COMPETE_INDUSTRY[key];
    var preview = block && block.homepage ? block.homepage : null;
    var ticker = preview && preview.ticker ? preview.ticker : (block && block.ticker ? block.ticker : []);
    if(!ctTicker || !ticker.length) return;
    var text = ticker.join('  |  ');
    ctTicker.textContent = text + '  |  ' + text;
  }

  function renderCompete(key){
    activeCompeteKey = key;
    renderCompeteTable(key);
    renderCompeteTicker(key);
    if(competeNoteEl && COMPETE_INDUSTRY[key]){
      var preview = COMPETE_INDUSTRY[key].homepage;
      var note = preview ? preview.sourceNote : COMPETE_INDUSTRY[key].sourceNote;
      competeNoteEl.textContent = '数据来源：' + (note || 'MOSS企业360透视');
    }
    if(competePanel && COMPETE_INDUSTRY[key] && COMPETE_INDUSTRY[key].panelHref){
      competePanel.dataset.href = COMPETE_INDUSTRY[key].panelHref;
    }
  }

  competeTabs.forEach(function(tab){
    tab.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      competeTabs.forEach(function(t){ t.setAttribute('aria-selected', t === tab ? 'true' : 'false'); });
      renderCompete(tab.dataset.key);
    });
  });
  renderCompete('robot');

  var competePanel = document.querySelector('.compete-panel.clickable-panel');
  bindClickablePanel(competePanel);

  function bindClickablePanel(panel){
    if(!panel) return;
    panel.addEventListener('click', function(e){
      if(e.target.closest('.no-navigate')) return;
      var href = panel.dataset.href;
      if(href) window.location.href = href;
    });
    panel.addEventListener('keydown', function(e){
      if((e.key === 'Enter' || e.key === ' ') && !e.target.closest('.no-navigate')){
        e.preventDefault();
        var href = panel.dataset.href;
        if(href) window.location.href = href;
      }
    });
  }

  renderTicker();
})();
</script>
</body>
</html>
